<body>
<div id="app">
  <main id="view" class="wrap"></main>
  <nav class="tabbar" aria-label="Main">
    <div class="in" id="tabs"></div>
  </nav>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   COURSE CONTENT
   ---------------------------------------------------------------------
   All curriculum lives here. The app code below never needs editing to
   add a module: replace a placeholder object (status: 'locked') with a
   full module object that has lessons, quiz, formulas and glossary.

   Module shape:
   { id, num, title, blurb, outline:[lesson titles],          // placeholders
     lessons:[{ id, title, minutes, lab?, goals:[], sources:'', cards:[] }],
     quiz:[question], formulas:[{n, f, v:[[symbol, definition]], note}],
     glossary:[[term, definition]] }

   Card types (t): concept | example | mistake | case | check | tool
                   + hands-on activities: ledger | build | arrows | sort | hunt | lab
     ledger: { id, h, b, unit, accounts:[[name,'A'|'L'|'E']], tx:[{ x, e:{account: change}, why, hint? }] }
     build:  { id, h, b, given?:{cols?, rows}, rows:[{ l, v (given) | a (answer), unit?, tol?, tot?, hint? }], why }
     arrows: { id, h, b, mode:'amt'|'dir', groups:[{ g, rows:[[label, answer]] }], why }
     sort:   { id, h, b, buckets:[...], items:[{ x, a (bucket index), why }] }
     hunt:   { id, h, b, cols:[...], need, rows:[{ l, v:[...], flag?, why }], debrief }
     lab:    { id, h, b, tool: TOOL_ID, init?, tasks:[{ x, hint, test: state => bool }], debrief }
     Activity ids must be unique and stable (progress is keyed on them).
     concept/mistake/case: { h, b, f?, note? }
     example: { h, b?, rows?:[[label, value]], f? }
     check:   { q: question }
     tool:    { tool: TOOL_ID, h, b }
   Question: { id, kind:'mc'|'num'|'order', q, opts?, a?, unit?, tol?, why }
     mc:    opts[] + a (index of correct option; options are shuffled)
     num:   a (number), unit, tol (absolute; default 1% of |a|)
     order: opts[] listed in the CORRECT order (shuffled on display)
   Markup in text: **bold**, \n = line break, inline HTML allowed.
   ===================================================================== */
window.COURSE = { modules: [] };

/* ------------------------------ MODULE 1 ------------------------------ */
COURSE.modules.push({
  id: 'm1', num: 1, title: 'Financial Accounting',
  blurb: 'The three statements, accruals, how the statements link, working capital, cash flow analysis and quality of earnings.',
  lessons: [

  /* ---------- 1.1 ---------- */
  { id: 'm1-l1', title: 'The Accounting Equation', minutes: 6,
    goals: ['Why every transaction hits two accounts', 'What shareholders’ equity actually represents', 'The retained-earnings bridge between statements'],
    sources: 'CFA Institute, CFA Program Curriculum Level I, Financial Statement Analysis (“Financial Reporting Mechanics”, “Analyzing Balance Sheets”); Berk & DeMarzo, Corporate Finance (“Introduction to Financial Statement Analysis”).',
    cards: [
      { t: 'concept', h: 'One identity holds everything',
        f: 'Assets = Liabilities + Shareholders’ Equity',
        b: `**Assets** are resources the firm controls that should produce future benefits. **Liabilities** are obligations to outsiders. **Equity** is the residual claim: what is left for shareholders after every creditor is paid. Because the identity always holds, every transaction changes at least two accounts. On a desk that is a sanity check: if cash moved, something else moved too.` },
      { t: 'concept', h: 'Double entry in 30 seconds',
        b: `Every transaction is recorded with equal debits and credits. **Debits** increase assets and expenses. **Credits** increase liabilities, equity and revenue. You won’t post journal entries at a fund, but thinking in pairs is how you debug a model. When the balance sheet is off by $12.4m, look for the transaction where only one side was booked.` },
      { t: 'ledger', id: 'm1-l1-a1', h: 'Book the first week',
        b: 'You keep the books for a new coffee roaster. Post each transaction: enter the change in every account it touches (tap ± for decreases). Sales and costs go straight to retained earnings here.',
        unit: '$',
        accounts: [['Cash', 'A'], ['Inventory', 'A'], ['Equipment', 'A'], ['Payables', 'L'], ['Deferred revenue', 'L'], ['Debt', 'L'], ['Share capital', 'E'], ['Retained earnings', 'E']],
        tx: [
          { x: 'Founders invest $100 in exchange for shares.', e: { 'Cash': 100, 'Share capital': 100 }, why: 'Cash comes in and the owners’ contributed capital rises by the same amount.' },
          { x: 'The company borrows $50 from a bank.', e: { 'Cash': 50, 'Debt': 50 }, why: 'An asset and a liability rise together. Equity is untouched: borrowing isn’t income.' },
          { x: 'It buys a $60 roaster, paying cash.', e: { 'Cash': -60, 'Equipment': 60 }, why: 'One asset swaps for another. Total assets don’t change.' },
          { x: 'It buys $20 of green coffee on credit.', e: { 'Inventory': 20, 'Payables': 20 }, why: 'Inventory and payables both rise. No expense yet, because nothing has been sold.' },
          { x: 'It sells coffee that cost $8 for $15 cash.', e: { 'Cash': 15, 'Inventory': -8, 'Retained earnings': 7 }, hint: 'Three accounts move: the cash received, the inventory that left, and the profit.', why: 'Revenue $15 − COGS $8 = $7 of profit, which lands in retained earnings. Inventory falls by its cost, not its selling price.' },
          { x: 'A café prepays $12 for next month’s deliveries.', e: { 'Cash': 12, 'Deferred revenue': 12 }, why: 'Cash received before delivery is a liability. No revenue until the coffee ships.' },
          { x: 'It pays $10 of the supplier bill.', e: { 'Cash': -10, 'Payables': -10 }, why: 'Settling a liability shrinks both sides. No expense: the cost was recorded when the coffee was sold.' }
        ] },
      { t: 'concept', h: 'Equity is a tally, not a pile of cash',
        b: `Shareholders’ equity = contributed capital (common stock + additional paid-in capital) + retained earnings − treasury stock ± accumulated other comprehensive income. **Retained earnings** is cumulative net income minus cumulative dividends. It is not cash. A firm can show $5bn of retained earnings and $200m of cash because the profits went into plants, inventory or acquisitions.` },
      { t: 'sort', id: 'm1-l1-a2', h: 'Asset, liability or equity?',
        b: 'Tap where each item belongs on the balance sheet.',
        buckets: ['Asset', 'Liability', 'Equity'],
        items: [
          { x: 'Inventory', a: 0, why: 'Goods held for sale: a resource expected to turn into cash.' },
          { x: 'Deferred revenue', a: 1, why: 'Cash received for goods or services still owed to the customer: an obligation.' },
          { x: 'Retained earnings', a: 2, why: 'Cumulative profits kept in the business: part of shareholders’ equity.' },
          { x: 'Prepaid insurance', a: 0, why: 'Coverage paid for but not yet used: a future benefit.' },
          { x: 'Accrued wages', a: 1, why: 'Wages staff have earned but not yet been paid: an obligation.' },
          { x: 'Treasury stock', a: 2, why: 'Repurchased shares are contra-equity. They reduce equity; they are not an asset.' },
          { x: 'Goodwill', a: 0, why: 'An intangible asset from acquisitions: the premium over identifiable net assets.' },
          { x: 'Operating lease liability', a: 1, why: 'Since ASC 842 / IFRS 16, the obligation to make lease payments sits on the balance sheet.' },
          { x: 'Additional paid-in capital', a: 2, why: 'What shareholders paid above par value: contributed capital.' }
        ] },
      { t: 'mistake', h: 'Treating book value as market value',
        b: `Book equity reflects historical cost and accounting rules. Market cap reflects expected future cash flows. A software firm with $2bn of book equity can be worth $40bn because its main assets (code, customer relationships, brand) were mostly expensed, never capitalized. Price-to-book is most useful for banks and insurers, whose assets are largely financial and carried near fair value.` },
      { t: 'concept', h: 'The retained-earnings roll-forward',
        f: 'RE<sub>end</sub> = RE<sub>begin</sub> + NI − Dividends',
        b: `This line is the bridge between the income statement and the balance sheet, and modelers check it every period. If it doesn’t roll, something hit equity directly (an accounting-standard transition adjustment, for example) or a dividend is missing. Buybacks usually sit in treasury stock, although companies that retire repurchased shares may charge part of the cost to retained earnings.` },
      { t: 'check', q: { id: 'm1-l1-q3', kind: 'num',
        q: 'Beginning retained earnings $1,200m, net income $300m, dividends declared $90m. What are ending retained earnings?', a: 1410, unit: '$m',
        why: `1,200 + 300 − 90 = $1,410m. Dividends reduce retained earnings when declared. They never appear on the income statement.` } },
      { t: 'check', q: { id: 'm1-l1-q4', kind: 'mc',
        q: 'Which transaction changes total assets but leaves equity unchanged?',
        opts: ['Borrowing $100 from a bank', 'Paying a $100 cash dividend', 'Earning $100 of revenue in cash', 'Recording $100 of depreciation'], a: 0,
        why: `Borrowing adds cash and an equal liability. The other three all change equity: dividends reduce retained earnings, revenue raises it through net income, and depreciation lowers it through net income.` } }
    ] },

  /* ---------- 1.2 ---------- */
  { id: 'm1-l2', title: 'The Income Statement', minutes: 7,
    goals: ['Read a P&L from revenue to diluted EPS', 'How revenue recognition (ASC 606 / IFRS 15) works', 'Why EBITDA is useful and dangerous'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Income Statements”); FASB ASC 606 and IFRS 15, Revenue from Contracts with Customers; SEC Regulation G and Regulation S-K Item 10(e) on non-GAAP financial measures.',
    cards: [
      { t: 'concept', h: 'From the top line to EPS',
        b: `Revenue − cost of goods sold = **gross profit**. Minus operating expenses (SG&A, R&D) = **operating income**, usually treated as EBIT. Minus interest = **pre-tax income**. Minus taxes = **net income**. Divide by diluted shares for **diluted EPS**. The income statement covers a period, such as a quarter or a year. The balance sheet is a snapshot at one date.`,
        note: 'EBIT and operating income are often used interchangeably, but definitions differ on non-operating items. Check what a given EBIT includes.' },
      { t: 'build', id: 'm1-l2-a1', h: 'Build the P&L',
        b: 'Fill in every blank from the raw data. Enter costs as negatives (tap ±). $m except per share.',
        given: { rows: [['Revenue', '1,000'], ['Cost of goods sold', '600'], ['SG&A', '150'], ['R&D', '50'], ['Interest expense', '20'], ['Tax rate', '25%'], ['Diluted shares', '50m']] },
        rows: [
          { l: 'Revenue', v: '1,000' },
          { l: 'Cost of goods sold', a: -600, hint: 'Costs are entered as negatives.' },
          { l: 'Gross profit', a: 400, tot: true, hint: 'Revenue − COGS.' },
          { l: 'Gross margin', a: 40, unit: '%', hint: 'Gross profit ÷ revenue.' },
          { l: 'SG&A + R&D', a: -200, hint: '150 + 50, entered as a cost.' },
          { l: 'EBIT', a: 200, tot: true, hint: 'Gross profit − operating expenses.' },
          { l: 'Interest expense', a: -20 },
          { l: 'Pre-tax income', a: 180, tot: true },
          { l: 'Taxes at 25%', a: -45, hint: '25% of pre-tax income.' },
          { l: 'Net income', a: 135, tot: true },
          { l: 'Diluted EPS', a: 2.7, unit: '$', tol: 0.006, hint: 'Net income ÷ 50m diluted shares.' }
        ],
        why: 'Margins (40% gross, 20% EBIT, 13.5% net), not dollar levels, are what get compared across peers and quarters.' },
      { t: 'concept', h: 'Revenue recognition in five steps',
        b: `Under ASC 606 / IFRS 15, revenue is recognized when control of a good or service passes to the customer, not when cash arrives. The steps: (1) identify the contract, (2) identify the performance obligations, (3) determine the transaction price, (4) allocate it to the obligations, (5) recognize revenue as each obligation is satisfied. US public companies adopted it for fiscal years beginning after Dec 15, 2017.` },
      { t: 'check', q: { id: 'm1-l2-q2', kind: 'order',
        q: 'Put the ASC 606 five-step model in order.',
        opts: ['Identify the contract', 'Identify performance obligations', 'Determine the transaction price', 'Allocate the price to obligations', 'Recognize revenue as obligations are satisfied'],
        why: `Contract → obligations → price → allocation → recognition. Most of the judgment sits in steps 2 and 4: what counts as a separate obligation, and how the price is split between them.` } },
      { t: 'build', id: 'm1-l2-a2', h: 'Run a deferred revenue schedule',
        b: 'A customer signs a 12-month, $120,000 subscription on Jan 1 and pays the full amount upfront. Revenue is recognized evenly as the service is delivered. Fill in the schedule in $000s.',
        rows: [
          { l: 'Q1 cash received', a: 120 },
          { l: 'Q1 revenue recognized', a: 30, hint: '3 of 12 months delivered.' },
          { l: 'Deferred revenue, Mar 31', a: 90, hint: 'Cash received − revenue recognized so far.' },
          { l: 'Q2 cash received', a: 0, hint: 'The customer already paid for the year.' },
          { l: 'Q2 revenue recognized', a: 30 },
          { l: 'Deferred revenue, Jun 30', a: 60, tot: true }
        ],
        why: 'Revenue is smooth while cash is lumpy. A company signing many upfront annual contracts shows cash and deferred revenue growing before revenue does. That is why SaaS investors track billings (revenue + change in deferred revenue).' },
      { t: 'concept', h: 'EBITDA', f: 'EBITDA = EBIT + D&amp;A',
        b: `EBITDA is the market’s favorite proxy for operating cash generation and the base for EV/EBITDA multiples and leverage covenants (debt/EBITDA). It is **non-GAAP**: SEC rules (Regulation G, Reg S-K Item 10(e)) require companies that present it to reconcile it to the most comparable GAAP measure. It ignores capex, working capital and taxes, so it flatters capital-intensive businesses.` },
      { t: 'mistake', h: 'Taking “adjusted” numbers at face value',
        b: `Adjusted EBITDA often excludes stock-based compensation, restructuring charges that recur every year, and “one-time” items that aren’t. SBC is a real cost, paid in shares instead of cash. If a company has had “non-recurring” charges in five of the last six years, they are recurring. Rebuild your own adjusted figure instead of using management’s.` },
      { t: 'case', h: 'Groupon’s ACSOI (2011)',
        b: `Groupon’s 2011 IPO filing featured “Adjusted Consolidated Segment Operating Income,” a metric that excluded online marketing, its main cost of acquiring customers. After SEC staff comments, the company dropped the metric from its amended filing. When a non-GAAP measure excludes the cost a business needs in order to grow, it describes a business that doesn’t exist.` },
      { t: 'check', q: { id: 'm1-l2-q4', kind: 'mc',
        q: 'A US-listed company presents “Adjusted EBITDA” in its earnings release. What do SEC rules require alongside it?',
        opts: ['A reconciliation to the most directly comparable GAAP measure', 'A separate audit opinion on the adjusted figure', 'Ten years of history for the measure', 'Nothing; non-GAAP measures are unregulated'], a: 0,
        why: `Regulation G (and Item 10(e) of Reg S-K for SEC filings) requires a reconciliation to the closest GAAP measure. In filings, the GAAP measure must also be presented with equal or greater prominence. The adjusted figure isn’t separately audited.` } },
      { t: 'concept', h: 'Diluted EPS and the treasury stock method',
        f: 'Net new shares = <i>n</i> × (<i>P̄</i> − <i>K</i>) / <i>P̄</i>',
        b: `Basic EPS = (net income − preferred dividends) / weighted average shares. Diluted EPS adds potential shares from options, RSUs and convertibles. For options, the **treasury stock method** assumes the exercise proceeds buy back stock at the average price P̄, so only net new shares count. Options with K above P̄ are anti-dilutive and excluded.` },
      { t: 'check', q: { id: 'm1-l2-q5', kind: 'num',
        q: '1,000,000 in-the-money options with a $40 strike; average share price $50. How many net new shares does the treasury stock method add?', a: 200000, unit: 'shares',
        why: `Exercise proceeds = 1,000,000 × $40 = $40m, which buys back $40m / $50 = 800,000 shares. Net new shares = 1,000,000 − 800,000 = 200,000. Shortcut: n × (P̄ − K) / P̄.` } }
    ] },

  /* ---------- 1.3 ---------- */
  { id: 'm1-l3', title: 'The Balance Sheet', minutes: 7,
    goals: ['How assets and liabilities are measured', 'Net debt, leases and goodwill', 'LIFO vs FIFO and the LIFO reserve'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Balance Sheets”, “Analysis of Inventories”, “Analysis of Long-Term Assets”); FASB ASC 350 (goodwill), ASC 842 and IFRS 16 (leases), IAS 38 (intangibles); Koller, Goedhart & Wessels, Valuation (McKinsey & Company).',
    cards: [
      { t: 'concept', h: 'A snapshot, sorted by liquidity',
        b: `Assets run from most to least liquid: cash, receivables and inventory (current, meaning expected to convert within a year or one operating cycle), then PP&E, intangibles and goodwill. Liabilities follow the same order: payables, accrued expenses, deferred revenue, short-term debt, then long-term debt, leases and deferred taxes. Analysts re-sort it into **operating** and **financing** items. That split is how invested capital and enterprise value are built.` },
      { t: 'concept', h: 'Book value is a patchwork',
        b: `Assets aren’t all at market value. PP&E is at historical cost less accumulated depreciation. Inventory is at the lower of cost and net realizable value (lower of cost or market for LIFO under US GAAP). Many financial assets are at fair value. Internally built intangibles, such as brands and most R&D, are expensed and never appear. “Book value” mixes several measurement bases.` },
      { t: 'check', q: { id: 'm1-l3-q1', kind: 'mc',
        q: 'A US pharma company spent $8bn on internal R&D over a decade and built a valuable drug pipeline. Where is most of that pipeline on its balance sheet?',
        opts: ['Mostly absent: internal R&D is expensed as incurred', 'In intangible assets at fair value', 'In goodwill', 'In PP&E at historical cost'], a: 0,
        why: `Under US GAAP, internal R&D is expensed as incurred, so the pipeline is mostly off the balance sheet. IFRS (IAS 38) lets companies capitalize development costs once strict criteria are met, but research is always expensed. Buy the same pipeline in a business combination and it does appear, as an acquired intangible.` } },
      { t: 'sort', id: 'm1-l3-a1', h: 'Operating or financing?',
        b: 'Analysts split the balance sheet into operating items (used to run the business) and financing items (how it is funded). The split drives invested capital and enterprise value.',
        buckets: ['Operating', 'Financing'],
        items: [
          { x: 'Accounts receivable', a: 0, why: 'Created by selling to customers: part of operating working capital.' },
          { x: 'Revolving credit facility (drawn)', a: 1, why: 'Borrowed money: debt.' },
          { x: 'Inventory', a: 0, why: 'Needed to run the business.' },
          { x: 'Senior notes due 2031', a: 1, why: 'Debt: a financing claim on the firm.' },
          { x: 'Deferred revenue', a: 0, why: 'An operating liability: customers fund the business by paying early. It reduces operating working capital.' },
          { x: 'Excess cash', a: 1, why: 'Cash beyond operating needs is netted against debt (net debt) instead of treated as an operating asset.' },
          { x: 'Accrued wages', a: 0, why: 'An operating liability created by running the business.' },
          { x: 'Preferred stock', a: 1, why: 'A financing claim that sits between debt and common equity in the EV bridge.' }
        ] },
      { t: 'mistake', h: 'Counting leases twice, or not at all',
        b: `Since 2019, ASC 842 and IFRS 16 put most leases on the balance sheet. Under IFRS 16, lease cost becomes depreciation plus interest, so EBITDA goes up. Under US GAAP, operating-lease cost stays in operating expense. If you add lease liabilities to EV, pair them with EBITDA before rent (EBITDAR), or you penalize the company twice. Comparing IFRS and US GAAP peers without adjusting distorts EV/EBITDA.` },
      { t: 'check', q: { id: 'm1-l3-q2', kind: 'num',
        q: 'Cash $250m, revolver drawn $50m, bonds outstanding $600m. What is net debt, excluding leases?', a: 400, unit: '$m',
        why: `Net debt = total debt − cash = (50 + 600) − 250 = $400m.` } },
      { t: 'concept', h: 'Goodwill', f: 'Goodwill = Price paid − FV of identifiable net assets',
        b: `When an acquirer pays more than the fair value of the target’s identifiable net assets, the excess is goodwill. US GAAP (for public companies) and IFRS don’t amortize it; they test it for impairment at least annually. An impairment is non-cash, but it admits the deal destroyed value. It often arrives years after the market priced in the damage.` },
      { t: 'build', id: 'm1-l3-a2', h: 'Allocate the purchase price',
        b: 'A buyer pays $1,000m for a target. Fair values at closing: receivables $100m, inventory $150m, PP&E $500m, identified intangibles (customer lists, brands) $150m. Liabilities assumed: $300m. $m.',
        rows: [
          { l: 'Fair value of identifiable assets', a: 900 },
          { l: 'Liabilities assumed', a: -300 },
          { l: 'Net identifiable assets', a: 600, tot: true },
          { l: 'Goodwill', a: 400, tot: true, hint: 'Price paid − net identifiable assets.' },
          { l: 'Later $150m impairment: change in pre-tax income', a: -150 },
          { l: 'Same impairment: change in cash', a: 0, hint: 'Impairments are non-cash.' }
        ],
        why: 'Goodwill is the residual. Finite-lived identified intangibles are amortized while goodwill is only tested for impairment, so how the price is split changes future earnings.' },
      { t: 'concept', h: 'Inventory: FIFO vs LIFO',
        b: `When prices rise, **LIFO** (last in, first out) charges the newest, highest costs to COGS: lower profit, lower taxes, and an inventory balance stuck at old prices. **FIFO** does the opposite. LIFO is allowed under US GAAP but not IFRS. US LIFO users disclose the **LIFO reserve** (FIFO inventory − LIFO inventory) so analysts can restate them to FIFO.` },
      { t: 'check', q: { id: 'm1-l3-q4', kind: 'mc',
        q: 'Prices are rising. Firm A uses LIFO, Firm B uses FIFO; they are otherwise identical. Which is true?',
        opts: ['A has higher COGS and pays less tax', 'A reports higher inventory', 'B reports higher COGS', 'Both report the same net income'], a: 0,
        why: `LIFO expenses the most recent, higher costs, so A’s COGS is higher, its pre-tax income lower and its cash taxes lower. A’s inventory is carried at older, lower costs.` } },
      { t: 'concept', h: 'Restating LIFO to FIFO',
        f: 'Inv<sub>FIFO</sub> = Inv<sub>LIFO</sub> + LIFO reserve<br>COGS<sub>FIFO</sub> = COGS<sub>LIFO</sub> − ΔLIFO reserve',
        b: `This is the standard CFA adjustment. On a FIFO basis, equity rises by the LIFO reserve × (1 − t), because the extra cumulative profit would have been taxed. The remaining reserve × t goes to a deferred tax liability (or lower cash, if you assume the taxes were paid).` },
      { t: 'build', id: 'm1-l3-a3', h: 'Restate a LIFO company to FIFO',
        b: 'A US company reports LIFO inventory of $400m and LIFO COGS of $2,000m. Its LIFO reserve rose from $100m to $120m during the year. Tax rate 25%. $m.',
        rows: [
          { l: 'FIFO inventory', a: 520, hint: 'LIFO inventory + ending LIFO reserve.' },
          { l: 'Change in LIFO reserve', a: 20 },
          { l: 'FIFO COGS', a: 1980, hint: 'LIFO COGS − the increase in the reserve.' },
          { l: 'Change in pre-tax income vs LIFO', a: 20 },
          { l: 'Cumulative increase in equity', a: 90, tot: true, hint: 'Ending reserve × (1 − tax rate).' }
        ],
        why: 'FIFO-basis numbers make a LIFO company comparable with FIFO and IFRS peers. The other $30m (reserve × tax rate) would go to a deferred tax liability.' }
    ] },

  /* ---------- 1.4 ---------- */
  { id: 'm1-l4', title: 'Accrual Accounting', minutes: 6,
    goals: ['Why accrual profit and cash diverge', 'The four types of accrual', 'Where judgment, and manipulation, enters'],
    sources: 'CFA Program Curriculum Level I (“Financial Reporting Mechanics”, “Analyzing Income Statements”); FASB ASC 340-40 (contract costs) and ASC 326 (current expected credit losses); SEC v. Albert J. Dunlap et al. (Sunbeam), complaint filed May 2001.',
    cards: [
      { t: 'concept', h: 'Accrual vs cash',
        b: `Under accrual accounting, revenue is recorded when earned and expenses when incurred, whatever the timing of cash. That is how a profitable company can run out of money, and how a loss-making one can pile up cash. The income statement measures economic performance. The cash flow statement tells you whether that performance turned into money.` },
      { t: 'concept', h: 'The four accruals',
        b: `Every timing gap is one of four types:\n**Accrued revenue**: earned, not yet received → receivable (asset).\n**Deferred revenue**: received, not yet earned → liability.\n**Accrued expense**: incurred, not yet paid → liability.\n**Prepaid expense**: paid, not yet incurred → asset.\nEach reverses later, when the cash or the earning catches up.` },
      { t: 'sort', id: 'm1-l4-a1', h: 'Which accrual is it?',
        b: 'Classify each item from the point of view of the company keeping the books.',
        buckets: ['Accrued revenue', 'Deferred revenue', 'Accrued expense', 'Prepaid expense'],
        items: [
          { x: 'A consultancy finishes December work it will bill in January', a: 0, why: 'Earned in December, not yet received: a receivable.' },
          { x: 'An airline sells tickets for flights next month', a: 1, why: 'Cash in, service not yet delivered: a liability until the flights operate.' },
          { x: 'December’s electricity bill arrives in January', a: 2, why: 'The cost was incurred in December, so it is accrued then, unpaid.' },
          { x: 'A retailer pays six months’ rent in advance', a: 3, why: 'Paid now for future periods: an asset expensed month by month.' },
          { x: 'Bond interest has built up since the last coupon date', a: 2, why: 'Interest cost incurred but not yet paid: an accrued liability.' },
          { x: 'A gym collects annual memberships upfront', a: 1, why: 'The gym owes a year of access: deferred revenue.' },
          { x: 'A company pays a 12-month software licence in January', a: 3, why: 'An advance payment for future use.' },
          { x: 'A drug company earns royalties its partner will report and pay next quarter', a: 0, why: 'Earned now, collected later: accrued revenue.' }
        ] },
      { t: 'check', q: { id: 'm1-l4-q1', kind: 'mc',
        q: 'On July 1 a company prepays 12 months of insurance for $24,000. What prepaid asset is on its September 30 balance sheet?',
        opts: ['$18,000', '$24,000', '$6,000', '$0'], a: 0,
        why: `Three months ($6,000) have been used and expensed. Nine months of coverage remain, so the prepaid asset is $18,000.` } },
      { t: 'concept', h: 'The matching principle',
        b: `Costs are matched to the revenue they help produce. A $100m machine used for 10 years is depreciated, not expensed on day one. Sales commissions on a three-year contract can be capitalized and amortized over the contract (ASC 340-40). Matching makes margins comparable across periods. Every capitalization decision is also a judgment that management can stretch.` },
      { t: 'lab', id: 'm1-l4-a2', tool: 'depreciation', h: 'Depreciation lab',
        b: 'Same machine, different accounting choices. Complete both tasks with the sliders.',
        tasks: [
          { x: 'With cost $100m and salvage $10m, find the useful life that makes straight-line depreciation exactly $6m a year.', hint: '(100 − 10) ÷ life = 6.', test: s => s.cost === 100 && s.salvage === 10 && Math.abs(s.sl1 - 6) < 1e-9 },
          { x: 'Make year-1 double-declining depreciation exceed straight-line by more than $20m.', hint: 'Shorter lives widen the gap. Try 5 years.', test: s => s.ddb1 - s.sl1 > 20 }
        ],
        debrief: 'Over the whole life both methods expense the same total (cost − salvage); they only shift profit between years. A longer life shrinks every year’s charge. Both choices sit in the notes, not the headline numbers.' },
      { t: 'mistake', h: 'Missing a change in useful life',
        b: `Lengthening asset lives cuts annual depreciation and lifts EPS with no change in the business. It can be justified, but it is disclosed in the notes, not the headline. Microsoft and Alphabet extended the useful lives of their servers to six years in 2022 and 2023, and both disclosed the expected effect on results. When margins jump, read the depreciation policy note first.` },
      { t: 'concept', h: 'Estimates inside accruals',
        b: `Many accruals are estimates. Receivables are shown net of an **allowance for credit losses** (the CECL model under US GAAP, adopted by most SEC filers in 2020). Warranty, returns and legal reserves are estimates too. Under-reserving inflates today’s earnings, and releasing reserves built in earlier years can quietly manufacture a beat. Track each reserve as a percentage of the exposure it covers.` },
      { t: 'check', q: { id: 'm1-l4-q4', kind: 'mc',
        q: 'Receivables grew 15% and revenue grew 15%, but the allowance for doubtful accounts fell 20%. What is the most likely implication?',
        opts: ['Earnings quality may be weaker: lower provisions boosted profit', 'Operating cash flow improved', 'Customer credit quality definitely improved', 'No effect on earnings'], a: 0,
        why: `A smaller allowance against a bigger receivables book means a lower provision expense, which lifts earnings. Better credit could justify it, but you’d want evidence, such as falling write-offs, before believing it.` } },
      { t: 'case', h: 'Sunbeam: pulling sales forward',
        b: `According to SEC charges filed in 2001, Sunbeam under CEO Al Dunlap inflated its 1997 results with “bill-and-hold” sales, booking revenue on goods customers agreed to buy that stayed in Sunbeam’s warehouses, along with other techniques that pulled future sales into the year. The restatement erased much of the reported turnaround. Revenue timing is a recurring theme in SEC enforcement.` }
    ] },

  /* ---------- 1.5 ---------- */
  { id: 'm1-l5', title: 'The Cash Flow Statement', minutes: 6,
    goals: ['The three sections and what goes where', 'Building CFO with the indirect method', 'How capitalizing costs inflates operating cash flow'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Statements of Cash Flows I & II”); FASB ASC 230; IASB IAS 7 and IFRS 18 (issued April 2024); SEC v. WorldCom, Inc., complaint filed June 26, 2002.',
    cards: [
      { t: 'concept', h: 'Three sections',
        b: `**Operating (CFO):** cash from running the business. **Investing (CFI):** capex, acquisitions, buying and selling securities. **Financing (CFF):** debt raised or repaid, shares issued or repurchased, dividends paid. The three sum to the change in cash. Cash flow is harder to manipulate than earnings, though not impossible, which is why skeptical analysts start here.` },
      { t: 'sort', id: 'm1-l5-a1', h: 'Operating, investing or financing?',
        b: 'Classify each cash flow under US GAAP.',
        buckets: ['Operating', 'Investing', 'Financing'],
        items: [
          { x: 'Cash collected from customers', a: 0, why: 'Core operations.' },
          { x: 'Capital expenditures', a: 1, why: 'Buying long-lived assets is investing.' },
          { x: 'Dividends paid', a: 2, why: 'A return to shareholders: financing.' },
          { x: 'Interest paid on bonds', a: 0, why: 'Under US GAAP interest paid is operating, even though the debt itself is financing.' },
          { x: 'Share buyback', a: 2, why: 'Returning capital to shareholders.' },
          { x: 'Cash paid to acquire a competitor', a: 1, why: 'Acquisitions are investing.' },
          { x: 'Income taxes paid', a: 0, why: 'Operating, unless tied to a specific investing or financing transaction.' },
          { x: 'Repaying a term loan', a: 2, why: 'Repaying debt principal is financing.' },
          { x: 'Proceeds from selling a factory', a: 1, why: 'Disposals of long-lived assets are investing.' },
          { x: 'Dividends received from an investment', a: 0, why: 'Operating under US GAAP (IAS 7 has allowed a choice).' }
        ] },
      { t: 'concept', h: 'The indirect method',
        b: `Nearly every company presents CFO indirectly. Start with net income. Add back non-cash charges (D&A, SBC, impairments, deferred taxes). Remove non-cash gains. Then adjust for working capital. The rule to remember: **an increase in an operating asset uses cash; an increase in an operating liability provides cash.**` },
      { t: 'build', id: 'm1-l5-a2', h: 'Build CFO from two balance sheets',
        b: 'Income statement: net income $135m, D&A $40m, stock-based comp $15m. Use the balance sheet changes below. Uses of cash are negative. $m.',
        given: { cols: ['', 'FY24', 'FY25'], rows: [['Receivables', '120', '150'], ['Inventory', '200', '220'], ['Payables', '90', '100'], ['Deferred revenue', '40', '45']] },
        rows: [
          { l: 'Net income', a: 135 },
          { l: '+ D&A', a: 40 },
          { l: '+ Stock-based comp', a: 15 },
          { l: 'Change in receivables', a: -30, hint: 'AR rose from 120 to 150. An asset increase uses cash.' },
          { l: 'Change in inventory', a: -20, hint: 'Inventory rose by 20.' },
          { l: 'Change in payables', a: 10, hint: 'A liability increase provides cash.' },
          { l: 'Change in deferred revenue', a: 5 },
          { l: 'Cash from operations', a: 155, tot: true }
        ],
        why: 'CFO beats net income because non-cash charges ($55m) exceed the working-capital build ($35m). Signs are the whole game: assets up, cash down; liabilities up, cash up.' },
      { t: 'mistake', h: 'Getting working-capital signs backwards',
        b: `The classic slip is adding an increase in receivables. If AR rose $30m, you booked $30m of revenue you haven’t collected, so subtract it. Memory aid: assets up, cash down; liabilities up, cash up. A fall in AR is a source of cash, because customers paid you.` },
      { t: 'concept', h: 'Where interest and dividends go',
        b: `Under US GAAP, interest paid, interest received and dividends received are operating cash flows; dividends paid are financing. IAS 7 has allowed choices, such as reporting interest paid in operating or financing, which hurts comparability. IFRS 18, effective for periods beginning on or after 1 January 2027, removes most of those choices for non-financial companies.`,
        note: 'IFRS 18 effective date and details as of November 2026; verify current.' },
      { t: 'case', h: 'WorldCom (2002)',
        b: `WorldCom recorded ordinary “line costs” (fees paid to other carriers to carry its traffic) as capital expenditures. That moved them off the income statement, lifting EBITDA and net income, and shifted the outflow from operating to investing, inflating CFO. The SEC’s June 2002 complaint cited about $3.8bn of improperly capitalized costs. WorldCom filed for bankruptcy in July 2002.` },
      { t: 'check', q: { id: 'm1-l5-q3', kind: 'mc',
        q: 'A firm wrongly capitalizes $100m of operating costs this year. Ignoring taxes, which statement is FALSE?',
        opts: ['Net income falls', 'CFO rises by $100m', 'CFI falls by $100m', 'The total change in cash is unaffected'], a: 0,
        why: `Capitalizing removes the cost from this year’s income statement, so net income rises (until the asset is depreciated). On the cash flow statement the outflow moves from operating to investing. Total cash is unchanged because the money was spent either way.` } },
      { t: 'concept', h: 'Capex and free cash flow', f: 'FCF (shorthand) = CFO − Capex',
        b: `Capex sits in investing, so CFO alone overstates what owners can take out. The common shorthand is CFO minus capex. Valuation uses precise versions, FCFF and FCFE, covered in lesson 1.8. Sell-side notes and company releases define “free cash flow” differently, so check the definition before you compare two numbers.` },
      { t: 'check', q: { id: 'm1-l5-q4', kind: 'order',
        q: 'Order the cash flow statement from top to bottom (indirect method).',
        opts: ['Net income', 'Add back non-cash charges', 'Changes in working capital', 'Cash from investing activities', 'Cash from financing activities', 'Net change in cash'],
        why: `Net income, then non-cash items, then working capital gives CFO. Investing and financing follow. The three sections sum to the net change in cash, which ties to the balance sheet.` } }
    ] },

  /* ---------- 1.6 ---------- */
  { id: 'm1-l6', title: 'How the Three Statements Link', minutes: 7,
    goals: ['The three links that make a model balance', 'Walk any transaction through IS, CFS and BS', 'Interview classics: depreciation, asset sales, SBC'],
    sources: 'CFA Program Curriculum Level I (“Financial Reporting Mechanics”); Rosenbaum & Pearl, Investment Banking: Valuation, LBOs, M&A, and IPOs (LBO model chapters); Koller, Goedhart & Wessels, Valuation (McKinsey & Company).',
    cards: [
      { t: 'concept', h: 'Three wires',
        b: `Three links connect the statements:\n1. **Net income** flows from the income statement to the top of the cash flow statement, and into retained earnings.\n2. **Non-cash items and working-capital changes** on the cash flow statement mirror movements on the balance sheet.\n3. **Ending cash** on the cash flow statement becomes cash on the balance sheet.\nIf a model doesn’t balance, one wire is cut.` },
      { t: 'example', h: 'The classic: depreciation up $10',
        b: `Tax rate 25%.\n**IS:** depreciation +$10 → pre-tax income −$10 → taxes −$2.50 → **net income −$7.50**.\n**CFS:** net income −$7.50, add back depreciation +$10 → **cash +$2.50**.\n**BS:** cash +$2.50, PP&E −$10, so assets −$7.50; retained earnings −$7.50. Balanced. The $2.50 of cash is the tax shield.` },
      { t: 'arrows', id: 'm1-l6-a1', mode: 'amt', h: 'Trace it: depreciation +$20',
        b: 'Depreciation rises by $20; tax rate 21%. Enter the change in every line (tap ± for decreases).',
        groups: [
          { g: 'Income statement', rows: [['Pre-tax income', -20], ['Income tax expense', -4.2], ['Net income', -15.8]] },
          { g: 'Cash flow statement', rows: [['Cash from operations', 4.2]] },
          { g: 'Balance sheet', rows: [['Cash', 4.2], ['PP&E, net', -20], ['Retained earnings', -15.8]] }
        ],
        why: 'Net income falls 20 × (1 − 0.21) = 15.8. Adding back the 20 of depreciation leaves cash up 4.2: the tax shield. Assets: +4.2 − 20 = −15.8, matching retained earnings.' },
      { t: 'lab', id: 'm1-l6-a2', tool: 'threeStatement', init: { ev: 'div' }, h: 'Linker lab',
        b: 'Use the linker to find an event that fits each description. Change the event, amount or tax rate.',
        tasks: [
          { x: 'An event that raises cash but lowers net income.', hint: 'Think of non-cash expenses that save tax.', test: s => s.cash > 1e-9 && s.NI < -1e-9 },
          { x: 'An event that raises net income but lowers cash.', hint: 'Profit you haven’t collected yet.', test: s => s.NI > 1e-9 && s.cash < -1e-9 },
          { x: 'An event that changes cash without touching net income or equity.', hint: 'Many balance-sheet-only moves qualify.', test: s => Math.abs(s.cash) > 1e-9 && Math.abs(s.NI) < 1e-9 && Math.abs(s.dE) < 1e-9 },
          { x: 'With a 25% tax rate, make total assets fall by exactly $15.', hint: 'A $20 non-cash expense does it. So does a $15 dividend.', test: s => Math.abs(s.TA + 15) < 1e-9 && Math.abs(s.t - 0.25) < 1e-9 }
        ],
        debrief: 'Net income and cash part ways whenever an item is non-cash (depreciation, write-downs, SBC) or a cash flow never touches the income statement (capex, debt, dividends, working capital). The cash flow statement exists to reconcile the two.' },
      { t: 'arrows', id: 'm1-l6-a3', mode: 'dir', h: 'Trace it: a customer prepays',
        b: 'A customer pays $50 today for products you’ll ship next quarter. Which way does each line move today?',
        groups: [
          { g: 'Income statement', rows: [['Revenue', 0], ['Net income', 0]] },
          { g: 'Cash flow statement', rows: [['Cash from operations', 1]] },
          { g: 'Balance sheet', rows: [['Cash', 1], ['Deferred revenue', 1], ['Retained earnings', 0]] }
        ],
        why: 'Cash arrives but nothing is earned yet, so it sits in deferred revenue, a liability. CFO rises through the increase in deferred revenue. Revenue comes next quarter, when the goods ship.' },
      { t: 'example', h: 'Selling an asset at a gain',
        b: `Sell equipment with a $40 book value for $60 cash; tax 25%.\n**IS:** gain +$20 → taxes +$5 → net income +$15.\n**CFS:** net income +$15, subtract the non-cash gain −$20 in CFO, proceeds +$60 in CFI → **cash +$55**.\n**BS:** cash +$55, PP&E −$40, so assets +$15; retained earnings +$15. The gain comes out of CFO so the full proceeds show in investing.` },
      { t: 'arrows', id: 'm1-l6-a4', mode: 'amt', h: 'Trace it: selling at a loss',
        b: 'Equipment with a $70 book value is sold for $50 cash; tax rate 25%. Enter each change.',
        groups: [
          { g: 'Income statement', rows: [['Pre-tax income', -20], ['Net income', -15]] },
          { g: 'Cash flow statement', rows: [['Cash from operations', 5], ['Cash from investing', 50]] },
          { g: 'Balance sheet', rows: [['Cash', 55], ['PP&E, net', -70], ['Retained earnings', -15]] }
        ],
        why: 'The $20 loss saves $5 of tax, so net income falls $15. CFO adds back the non-cash loss: −15 + 20 = +5, the tax saving. The full $50 of proceeds is investing. Cash +55; assets +55 − 70 = −15, matching retained earnings.' },
      { t: 'mistake', h: 'Forgetting the tax line',
        b: `Interviewers ask the depreciation question because candidates say “cash is unchanged, depreciation is non-cash.” Depreciation is non-cash, but it is tax-deductible, so it changes cash taxes. These examples assume book and tax depreciation are equal. In practice they differ, and the gap creates deferred tax assets and liabilities.` },
      { t: 'check', q: { id: 'm1-l6-q4', kind: 'mc',
        q: 'A company records $30 of stock-based compensation; tax rate 25%. Assume the expense is deductible now. Which is correct?',
        opts: ['Net income −22.5, cash +7.5, total equity +7.5', 'Net income −30, cash −30', 'Net income −22.5, cash −22.5', 'No effect, because SBC is non-cash'], a: 0,
        why: `Net income falls 30 × 0.75 = 22.5. CFO adds back the $30 non-cash expense, so cash rises 7.5 (the tax saving). Equity: paid-in capital +30, retained earnings −22.5, net +7.5, matching the cash. In practice the US tax deduction arrives at vesting or exercise, not when the expense is booked.` } },
      { t: 'concept', h: 'Circularity in models',
        b: `In a full model, interest expense depends on average debt, debt depends on the cash sweep, and the cash sweep depends on net income after interest. That is a circular reference. Modelers either enable iterative calculation with a circuit-breaker switch, or calculate interest on beginning-of-period balances. Know which your model does; it is a common reason a balance sheet suddenly breaks.` }
    ] },

  /* ---------- 1.7 ---------- */
  { id: 'm1-l7', title: 'Working Capital', minutes: 7,
    goals: ['Operating working capital vs the accounting definition', 'DSO, DIO, DPO and the cash conversion cycle', 'Why growth consumes cash'],
    sources: 'CFA Program Curriculum Level I (“Financial Analysis Techniques”; Corporate Issuers, working capital and liquidity); Koller, Goedhart & Wessels, Valuation (McKinsey & Company); Berk & DeMarzo, Corporate Finance (“Working Capital Management”); Report of Examiner Anton R. Valukas, In re Lehman Brothers Holdings Inc. (March 2010).',
    cards: [
      { t: 'concept', h: 'Operating working capital',
        b: `The accounting definition is current assets − current liabilities. For valuation, use **operating** working capital: receivables + inventory + prepaid expenses − payables − accrued expenses − deferred revenue. Leave out cash and short-term debt; they are financing items. An increase in operating working capital is cash invested in the business, just like capex.` },
      { t: 'concept', h: 'Three day-counts',
        f: 'DSO = <span class="fr"><span>Receivables</span><span>Revenue</span></span> × 365 &nbsp; DIO = <span class="fr"><span>Inventory</span><span>COGS</span></span> × 365<br>DPO = <span class="fr"><span>Payables</span><span>COGS</span></span> × 365 &nbsp; CCC = DSO + DIO − DPO',
        b: `The **cash conversion cycle** counts the days cash is tied up between paying suppliers and collecting from customers. Conventions vary: some analysts use average balances, 360 days, or purchases instead of COGS for DPO. Pick one and apply it consistently across peers.` },
      { t: 'build', id: 'm1-l7-a1', h: 'Compute the cycle',
        b: 'Revenue $730m, COGS $438m. Period-end receivables $80m, inventory $60m, payables $48m. Use 365 days.',
        rows: [
          { l: 'DSO', a: 40, unit: 'days', hint: 'Receivables ÷ revenue × 365.' },
          { l: 'DIO', a: 50, unit: 'days', hint: 'Inventory ÷ COGS × 365.' },
          { l: 'DPO', a: 40, unit: 'days', hint: 'Payables ÷ COGS × 365.' },
          { l: 'Cash conversion cycle', a: 50, unit: 'days', tot: true, hint: 'DSO + DIO − DPO.' },
          { l: 'Operating working capital', a: 92, unit: '$m', hint: 'Receivables + inventory − payables.' },
          { l: 'Cash per day of DSO', a: 2, unit: '$m', hint: 'Revenue ÷ 365.' }
        ],
        why: 'About $92m is tied up in the operating cycle, and every day of DSO is worth $2m. Those are the numbers a CFO targets with a working-capital program.' },
      { t: 'concept', h: 'What one day is worth',
        b: `One day of DSO ties up revenue ÷ 365 in cash. At $3.65bn of revenue, one extra day of DSO absorbs $10m. That is why working-capital programs (faster collections, longer supplier terms, supply-chain finance) can release hundreds of millions without changing profit. It is also why a sudden jump in DSO needs an explanation.` },
      { t: 'lab', id: 'm1-l7-a2', tool: 'ccc', h: 'Working-capital lab',
        b: 'You are the new CFO. Revenue $1,000m, COGS 60% of revenue, DSO 45, DIO 60, DPO 40.',
        tasks: [
          { x: 'Release at least $50m of cash by changing DSO only.', hint: 'Each day of DSO is worth about $2.7m here. You need about 19 days.', test: s => s.rev === 1000 && s.cg === 60 && s.dio === 60 && s.dpo === 40 && s.owc <= 106.17 },
          { x: 'Make the cash conversion cycle negative.', hint: 'Push DPO above DSO + DIO.', test: s => s.ccc < 0 },
          { x: 'Double revenue to $2,000m and watch working capital.', hint: 'Drag revenue to 2,000.', test: s => s.rev >= 2000 }
        ],
        debrief: 'At constant days, working capital scales with revenue: double sales, double the cash tied up. That is why fast growers burn cash, and why negative-cycle businesses, where suppliers fund customers, can grow almost for free.' },
      { t: 'check', q: { id: 'm1-l7-q2', kind: 'num',
        q: 'Revenue is $1,825m. DSO falls from 50 to 44 days. How much cash is released?', a: 30, unit: '$m',
        why: `Revenue per day = 1,825 / 365 = $5m. Six fewer days × $5m = $30m released.` } },
      { t: 'mistake', h: 'Assuming growth funds itself',
        b: `A growing business must fund extra receivables and inventory before customers pay. If the cycle is about 60 days of revenue, growing from $1.0bn to $1.3bn ties up roughly 60/365 × $300m ≈ $49m. Profitable fast-growers can run out of cash this way.`,
        note: 'Simplification: this treats the whole cycle as days of revenue. A full build uses COGS for inventory and payables.' },
      { t: 'case', h: 'Negative working capital',
        b: `Some retailers collect from customers within days (card payments) but pay suppliers over weeks or months. That produces a **negative** cash conversion cycle: suppliers effectively finance growth. Amazon is the textbook example. The flip side: if growth stalls or reverses, the float shrinks and the business starts consuming cash.` },
      { t: 'case', h: 'Lehman’s Repo 105',
        b: `Balance sheets are measured at period-end, which invites window dressing. The Lehman bankruptcy examiner’s report (Valukas, 2010) found Lehman used “Repo 105” transactions to move about $50bn of assets off its balance sheet at the end of Q2 2008, lowering reported net leverage, then brought them back days later. Compare period-end balances with averages when you can.` }
    ] },

  /* ---------- 1.8 ---------- */
  { id: 'm1-l8', title: 'Cash Flow Analysis: FCFF and FCFE', minutes: 7,
    goals: ['FCFF vs FCFE and the discount rate each needs', 'The CFA formulas, and why interest is added back after tax', 'Maintenance capex and stock-based comp'],
    sources: 'CFA Program Curriculum Level II, Equity Valuation (“Free Cash Flow Valuation”); Damodaran, Investment Valuation; Koller, Goedhart & Wessels, Valuation (McKinsey & Company); SEC press release on settlements with J.P. Morgan Chase and Citigroup over Enron transactions (July 2003).',
    cards: [
      { t: 'concept', h: 'Two kinds of free cash flow',
        b: `**FCFF** (free cash flow to the firm) is cash available to all capital providers, debt and equity, after operating costs, taxes and reinvestment. Discount it at WACC to get enterprise value. **FCFE** (to equity) is what is left for shareholders after paying debt holders and adding net borrowing. Discount it at the cost of equity to get equity value. Discounting FCFE at WACC is a classic error.` },
      { t: 'sort', id: 'm1-l8-a1', h: 'Which discount rate?',
        b: 'Match each cash flow to the rate that discounts it.',
        buckets: ['WACC', 'Cost of equity'],
        items: [
          { x: 'FCFF', a: 0, why: 'Cash flow to all capital providers: discount at the blended cost of all capital.' },
          { x: 'FCFE', a: 1, why: 'Cash flow to shareholders only: discount at their required return.' },
          { x: 'Dividends', a: 1, why: 'Paid to equity holders.' },
          { x: 'Unlevered free cash flow', a: 0, why: 'Another name for FCFF: before any financing flows.' },
          { x: 'Cash flow after interest and net borrowing', a: 1, why: 'That is FCFE.' },
          { x: 'NOPAT minus net investment', a: 0, why: 'An operating, pre-financing cash flow: FCFF.' }
        ] },
      { t: 'concept', h: 'The formulas (CFA notation)',
        f: 'FCFF = NI + NCC + Int(1 − <i>t</i>) − FCInv − WCInv<br>FCFF = CFO + Int(1 − <i>t</i>) − FCInv<br>FCFF = EBIT(1 − <i>t</i>) + Dep − FCInv − WCInv<br>FCFE = CFO − FCInv + Net borrowing',
        b: `NCC = non-cash charges. FCInv = fixed capital investment (capex net of asset sales). WCInv = investment in working capital. Int = interest expense. With consistent inputs, all three FCFF routes give the same number.` },
      { t: 'build', id: 'm1-l8-a2', h: 'From EBIT to FCFF and FCFE',
        b: 'EBIT $200m, tax 25%, D&A $40m, capex $70m, operating working capital up $15m, interest expense $20m, net new borrowing $10m. $m.',
        rows: [
          { l: 'NOPAT', a: 150, hint: 'EBIT × (1 − t).' },
          { l: '+ D&A', a: 40 },
          { l: '− Capex', a: -70 },
          { l: '− Increase in working capital', a: -15 },
          { l: 'FCFF', a: 105, tot: true },
          { l: '− After-tax interest', a: -15, hint: '20 × (1 − 0.25).' },
          { l: '+ Net borrowing', a: 10 },
          { l: 'FCFE', a: 100, tot: true }
        ],
        why: 'Discount the 105 at WACC for enterprise value, or the 100 at the cost of equity for equity value. The interest tax shield lives in WACC (the after-tax cost of debt), so FCFF leaves it out.' },
      { t: 'check', q: { id: 'm1-l8-q1', kind: 'num',
        q: 'CFO $300m, interest expense $40m, tax rate 25%, capex $120m. What is FCFF?', a: 210, unit: '$m',
        why: `FCFF = CFO + Int(1 − t) − FCInv = 300 + 40 × 0.75 − 120 = $210m.` } },
      { t: 'mistake', h: 'Adding back interest in full',
        b: `Under US GAAP, CFO is already after interest. FCFF is meant to be before financing, so you add interest back, but only Int × (1 − t), because the deduction saved taxes and that saving is already in CFO. In a DCF the tax shield is captured in WACC through the after-tax cost of debt. Leaving it in FCFF as well counts it twice.` },
      { t: 'concept', h: 'Maintenance vs growth capex',
        b: `**Maintenance capex** keeps existing capacity running; **growth capex** adds capacity. Companies rarely disclose the split. A common rough proxy is maintenance capex ≈ depreciation, which breaks down under inflation (depreciation reflects old costs) or when technology changes fast. Only maintenance capex is a cost of today’s earnings, so owner-earnings investors try to estimate it.`,
        note: 'Simplification: the depreciation proxy is a rule of thumb, not an accounting standard.' },
      { t: 'concept', h: 'Stock-based comp and FCF',
        b: `SBC is added back in CFO because it is non-cash, so reported FCF flatters SBC-heavy companies. The cost shows up as dilution instead. Desks handle it one of two ways: subtract SBC from FCF, or leave it in and use a share count that includes expected future grants. Pick one. Ignoring both overstates value per share.`,
        note: 'How to treat SBC in valuation is debated. Damodaran argues it should be treated as an operating expense.' },
      { t: 'check', q: { id: 'm1-l8-q3', kind: 'mc',
        q: 'A tech company’s CFO of $1,000m includes a $250m SBC add-back; capex is $200m. What is FCF after SBC?',
        opts: ['$550m', '$800m', '$1,050m', '$1,250m'], a: 0,
        why: `FCF = 1,000 − 200 = $800m. Treating SBC as a cash-equivalent cost: 800 − 250 = $550m.` } },
      { t: 'case', h: 'Enron: operating cash flow can be engineered',
        b: `Enron reported rising earnings using mark-to-market gains on long-term contracts and deals with off-balance-sheet entities that also hid debt. It also used “prepay” transactions that were economically loans but were booked as operating cash inflows. In 2003 the SEC settled with J.P. Morgan Chase and Citigroup over their roles in those prepays. Enron filed for bankruptcy on December 2, 2001.` },
      { t: 'check', q: { id: 'm1-l8-q4', kind: 'mc',
        q: 'Which most suggests low-quality operating cash flow?',
        opts: ['CFO boosted by stretching payables and selling receivables at quarter-end', 'CFO above net income because of large D&A', 'CFO growing in line with revenue', 'CFO stable over five years'], a: 0,
        why: `Stretching payables and selling (factoring) receivables pull cash forward. These are one-off timing moves that reverse. D&A-driven CFO is normal for capital-intensive firms.` } }
    ] },

  /* ---------- 1.9 ---------- */
  { id: 'm1-l9', title: 'Quality of Earnings', minutes: 7,
    goals: ['What makes earnings high quality', 'Accruals ratio and cash conversion', 'Red flags, screening models and how a fund uses them'],
    sources: 'CFA Program Curriculum (“Financial Reporting Quality”, “Evaluating Quality of Financial Reports”); Sloan (1996), The Accounting Review; Beneish (1999), “The Detection of Earnings Manipulation,” Financial Analysts Journal; Wirecard AG ad hoc disclosures (June 2020).',
    cards: [
      { t: 'concept', h: 'Two questions',
        b: `Earnings quality asks: (1) Do reported earnings faithfully show this period’s economic performance? (2) Are they **sustainable**? High-quality earnings are backed by cash, built on conservative estimates and free of one-offs. The CFA curriculum describes a spectrum, from GAAP-compliant, useful and sustainable at the top, down through biased choices and earnings management to fictitious transactions.` },
      { t: 'concept', h: 'The accruals ratio',
        f: 'Accruals ratio<sup>CF</sup> = <span class="fr"><span>NI − (CFO + CFI)</span><span>Average NOA</span></span>',
        b: `Earnings = cash flow + accruals, and accruals are where judgment lives. High accruals relative to net operating assets (NOA) flag lower-quality earnings. Sloan (1996) found that firms with high accruals tended to have lower future earnings and lower subsequent stock returns: the “accrual anomaly.”`,
        note: 'How much of the accrual anomaly survived after publication is debated in later research.' },
      { t: 'example', h: 'Same EPS, different quality',
        b: `**Firm A:** net income $100m, CFO $130m.\n**Firm B:** net income $100m, CFO $40m; receivables up $45m and inventory up $25m.\nCash conversion (CFO ÷ NI): A = 1.3×, B = 0.4×. B’s profit is mostly unpaid invoices and unsold goods. Before trusting B’s guidance, find out why customers aren’t paying and why stock is piling up.` },
      { t: 'check', q: { id: 'm1-l9-q2', kind: 'num',
        q: 'Net income $120m, CFO $90m, CFI −$50m, average net operating assets $800m. What is the cash-flow accruals ratio?', a: 10, unit: '%',
        why: `Accruals = NI − (CFO + CFI) = 120 − (90 − 50) = $80m. Ratio = 80 / 800 = 10%. Watch the sign: CFI is negative, so the bracket is only $40m.` } },
      { t: 'lab', id: 'm1-l9-a1', tool: 'quarter', h: 'Make the quarter',
        b: 'You are the CFO. Consensus expects EPS of $0.80; the honest number is $0.68. Pull the accounting levers and watch what an analyst would see.',
        tasks: [
          { x: 'Beat the $0.80 consensus.', hint: 'Any lever that adds about $17m of pre-tax profit works.', test: s => s.eps >= 0.8 - 1e-9 },
          { x: 'Beat it while keeping cash conversion (CFO ÷ net income) at 1.0× or better.', hint: 'One lever raises CFO as well as earnings. WorldCom used it.', test: s => s.eps >= 0.8 - 1e-9 && s.conv >= 1 },
          { x: 'Beat it while tripping only one red flag.', hint: 'Use a single lever. Several work on their own.', test: s => s.eps >= 0.8 - 1e-9 && s.flags <= 1 }
        ],
        debrief: 'Every lever produced a beat that EPS alone can’t detect, and every lever left a footprint: DSO (pulled-forward sales), reserve coverage (reserve releases), D&A versus capex (asset lives, capitalization), cash conversion and payables days. That is why quality-of-earnings work tracks these ratios every quarter.' },
      { t: 'hunt', id: 'm1-l9-a2', h: 'Investigate Company X',
        b: 'Three years of selected data, $m. Tap the four rows that should worry you, then check.',
        cols: ['FY23', 'FY24', 'FY25'], need: 4,
        rows: [
          { l: 'Revenue', v: ['800', '880', '960'], why: 'Steady growth of about 9–10% a year. Not a concern on its own.' },
          { l: 'Receivables', v: ['100', '115', '180'], flag: true, why: 'Up 57% in FY25 while revenue grew 9%. DSO jumped from about 48 to 68 days: pulled-forward or uncollectible sales.' },
          { l: 'Inventory', v: ['120', '130', '140'], why: 'Growing roughly in line with sales.' },
          { l: 'Gross margin', v: ['38.0%', '38.5%', '39.0%'], why: 'Stable to slightly better. Fine.' },
          { l: 'Allowance for doubtful accounts', v: ['8', '9', '6'], flag: true, why: 'Falling while receivables jump: coverage dropped from 7.8% to 3.3% of receivables. A smaller provision flattered earnings.' },
          { l: 'Capitalized software costs', v: ['0', '0', '25'], flag: true, why: 'A new capitalization policy moved $25m of costs out of the income statement and into investing cash flow.' },
          { l: 'Net income', v: ['60', '66', '84'], why: 'Up 27%, which looks great. Whether it is real depends on the rows around it.' },
          { l: 'Cash from operations', v: ['75', '80', '52'], flag: true, why: 'Down 35% while net income rose 27%: cash conversion fell from 1.2× to 0.6×. Earnings are not turning into cash.' },
          { l: 'Capex', v: ['40', '42', '45'], why: 'Modest growth, in line with the business.' }
        ],
        debrief: 'Each flag alone could be innocent. Together, rising DSO, falling reserves, newly capitalized costs and collapsing cash conversion tell one story: earnings are being pulled forward. This cluster is what screens such as the Beneish M-score look for.' },
      { t: 'concept', h: 'Red-flag checklist',
        b: `• Revenue growth with rising DSO\n• Inventory growing faster than sales\n• Capitalizing costs that peers expense\n• Longer asset lives\n• Reserves shrinking relative to exposure\n• “Non-recurring” charges every year\n• A widening gap between non-GAAP and GAAP earnings\n• Quarter-end spikes in sales or cash\n• Auditor changes, late filings, CFO turnover\nOne flag isn’t fraud. Clusters deserve work.` },
      { t: 'concept', h: 'The Beneish M-score',
        b: `Beneish’s (1999) M-score is a probit model built on eight ratios, including days’ sales in receivables, gross margin, asset quality, sales growth and total accruals to total assets, estimated on firms known to have manipulated earnings. A higher score means a higher estimated probability of manipulation. Use it as a screen that tells you where to dig, not as a verdict. It throws false positives, especially among fast growers.` },
      { t: 'mistake', h: 'Trusting “one-time” items',
        b: `Restructuring charges, special items, litigation and impairments are excluded from adjusted EPS as one-offs. Count them over 5 to 10 years; if they recur, average them into normalized earnings. Also watch for a **big bath**: dumping excess costs into one bad quarter so later quarters look better. Some of those reserves can later be released back into income.` },
      { t: 'case', h: 'Wirecard (2020)',
        b: `Wirecard, a German payments company in the DAX index, reported about €1.9bn of cash held in third-party trust accounts in Asia. In June 2020 its auditor, EY, said it could not obtain sufficient evidence that the balances existed. Wirecard then said the cash most likely didn’t exist and filed for insolvency within days. Even cash can be faked when nobody confirms it directly with the bank.` },
      { t: 'concept', h: 'How a fund uses this',
        b: `A long/short analyst rebuilds clean EBITDA and FCF, compares non-GAAP and GAAP trends, tracks DSO, DIO and reserves every quarter, reads the revenue recognition and critical accounting estimates notes, and benchmarks policies against peers. Short sellers specialize in this work, and they get it wrong too. The goal isn’t to find fraud; it is to know what the earnings are actually worth.` }
    ] },

  /* ---------- 1.10 (lab) ---------- */
  { id: 'm1-l10', title: 'Lab: Book Northwind’s First Month', minutes: 7, lab: true,
    goals: ['Post ten real transactions with double entry', 'Watch a balance sheet build up from zero', 'Keep assets = liabilities + equity at every step'],
    sources: 'CFA Program Curriculum Level I (“Financial Reporting Mechanics”); Berk & DeMarzo, Corporate Finance (“Introduction to Financial Statement Analysis”). Northwind Roasters is a fictional company built for this exercise.',
    cards: [
      { t: 'concept', h: 'Meet Northwind Roasters',
        b: `Northwind is a coffee roaster opening in March, and you are its first accountant. You’ll post every transaction of the month. In the next lab you’ll build its income statement and cash flow statement from your own books. Ignore taxes. In the ledger, sales and expenses flow straight to retained earnings. All figures in $000s.` },
      { t: 'ledger', id: 'm1-l10-a1', h: 'Close the books for March',
        b: 'Post each transaction. Enter the change in every account it touches; tap ± for decreases. $000s.',
        unit: '$k',
        accounts: [['Cash', 'A'], ['Receivables', 'A'], ['Inventory', 'A'], ['Equipment (net)', 'A'], ['Payables', 'L'], ['Accrued liabilities', 'L'], ['Deferred revenue', 'L'], ['Debt', 'L'], ['Share capital', 'E'], ['Retained earnings', 'E']],
        tx: [
          { x: 'The founders invest $200k in exchange for shares.', e: { 'Cash': 200, 'Share capital': 200 }, why: 'Cash in, contributed capital up.' },
          { x: 'Northwind borrows $100k from a bank.', e: { 'Cash': 100, 'Debt': 100 }, why: 'Asset and liability rise together. Borrowing is never income.' },
          { x: 'It buys roasting equipment for $120k cash.', e: { 'Cash': -120, 'Equipment (net)': 120 }, why: 'Capex swaps cash for a long-lived asset. No expense today; depreciation spreads the cost.' },
          { x: 'It buys $60k of green coffee on credit.', e: { 'Inventory': 60, 'Payables': 60 }, why: 'Inventory and payables both rise. No cash moves yet.' },
          { x: 'It sells roasted coffee for $90k: $50k paid in cash, $40k on credit. The coffee sold cost $36k.', e: { 'Cash': 50, 'Receivables': 40, 'Inventory': -36, 'Retained earnings': 54 }, hint: 'Four accounts move: the two ways the customer pays, the inventory that left, and the profit (90 − 36).', why: 'Revenue of $90k is earned whether or not it is collected. Profit of $54k (90 − 36) goes to retained earnings; inventory falls by its cost.' },
          { x: 'A café chain prepays $30k for April deliveries.', e: { 'Cash': 30, 'Deferred revenue': 30 }, why: 'Cash before delivery is a liability. It becomes revenue in April.' },
          { x: 'Northwind pays $25k of March wages in cash.', e: { 'Cash': -25, 'Retained earnings': -25 }, why: 'An expense paid immediately: cash and retained earnings both fall.' },
          { x: 'It records $2k of depreciation on the equipment.', e: { 'Equipment (net)': -2, 'Retained earnings': -2 }, why: 'A non-cash expense: the asset’s book value falls and so does profit. Cash is untouched.' },
          { x: 'It pays $35k of the supplier bill.', e: { 'Cash': -35, 'Payables': -35 }, why: 'Settling a liability. No expense: the coffee’s cost was expensed when it was sold.' },

  /* ---------- Module 1 glossary ---------- */
  glossary: [
    ['Accrual accounting', 'Recording revenue when earned and expenses when incurred, regardless of when cash moves.'],
    ['Accrued expense', 'An expense incurred but not yet paid; recorded as a liability (e.g., wages payable).'],
    ['Accruals ratio', 'Accruals scaled by average net operating assets; a measure of how much of earnings is not backed by cash.'],
    ['Additional paid-in capital (APIC)', 'Amount shareholders paid for stock above its par value; part of contributed capital.'],
    ['Allowance for credit losses', 'Contra-asset that reduces receivables to the amount expected to be collected. Under US GAAP estimated with the CECL model.'],
    ['ASC 606 / IFRS 15', 'The revenue recognition standards: a five-step model recognizing revenue as control of goods or services transfers.'],
    ['ASC 842 / IFRS 16', 'Lease accounting standards (effective 2019) that put most leases on the balance sheet as right-of-use assets and lease liabilities.'],
    ['Balance sheet', 'Statement of assets, liabilities and equity at a single date.'],
    ['Beneish M-score', 'An eight-variable probit model (Beneish, 1999) estimating the probability that a company is manipulating earnings.'],
    ['Big bath', 'Taking unusually large charges in one period so that future periods look better.'],
    ['Bill-and-hold', 'Recognizing revenue on goods the customer has bought but which remain in the seller’s possession; legitimate only under strict conditions.'],
    ['Capital expenditures (capex)', 'Cash spent acquiring or improving long-lived assets such as PP&E; an investing cash flow.'],
    ['Cash conversion cycle (CCC)', 'DSO + DIO − DPO: days cash is tied up between paying suppliers and collecting from customers.'],
    ['Cash conversion ratio', 'CFO divided by net income; below 1 means earnings are not fully backed by operating cash.'],
    ['CECL', 'Current expected credit loss model (ASC 326), requiring lifetime expected losses to be reserved up front.'],
    ['CFF', 'Cash flow from financing activities: debt and equity raised or repaid, dividends paid.'],
    ['CFI', 'Cash flow from investing activities: capex, acquisitions, purchases and sales of investments.'],
    ['CFO', 'Cash flow from operating activities: cash generated by the core business.'],
    ['Cost of goods sold (COGS)', 'Direct costs of producing goods or services sold in the period.'],
    ['Deferred revenue', 'Cash received before the related goods or services are delivered; a liability until earned.'],
    ['Deferred tax liability / asset', 'Future tax payable or recoverable arising from timing differences between book and tax accounting.'],
    ['Depreciation', 'Systematic allocation of a tangible asset’s cost over its useful life.'],
    ['Diluted EPS', 'Earnings per share including the effect of options, RSUs and convertibles that would increase the share count.'],
    ['DIO', 'Days inventory outstanding: inventory ÷ COGS × 365.'],
    ['DPO', 'Days payables outstanding: payables ÷ COGS (or purchases) × 365.'],
    ['DSO', 'Days sales outstanding: receivables ÷ revenue × 365.'],
    ['EBIT', 'Earnings before interest and taxes; usually treated as operating income.'],
    ['EBITDA', 'EBIT plus depreciation and amortization; a non-GAAP proxy for operating cash generation.'],
    ['EBITDAR', 'EBITDA before rent (lease) expense; used when lease liabilities are added to debt.'],
    ['FCFE', 'Free cash flow to equity: cash available to shareholders after reinvestment, debt service and net borrowing.'],
    ['FCFF', 'Free cash flow to the firm: cash available to all capital providers after taxes and reinvestment.'],
    ['FIFO', 'First in, first out: the oldest inventory costs go to COGS first.'],
    ['GAAP', 'Generally Accepted Accounting Principles; in the US, set by the FASB.'],
    ['Goodwill', 'Excess of an acquisition’s purchase price over the fair value of identifiable net assets acquired.'],
    ['IFRS', 'International Financial Reporting Standards, issued by the IASB and used in most countries outside the US.'],
    ['Impairment', 'A write-down when an asset’s carrying amount exceeds its recoverable amount or fair value.'],
    ['Indirect method', 'Presenting CFO by starting from net income and adjusting for non-cash items and working capital.'],
    ['LIFO', 'Last in, first out: the newest inventory costs go to COGS first. Allowed under US GAAP, not IFRS.'],
    ['LIFO reserve', 'Difference between inventory under FIFO and under LIFO, disclosed by US LIFO users.'],
    ['Maintenance capex', 'Capital spending needed to sustain existing capacity, as opposed to growth capex.'],
    ['Matching principle', 'Recognizing expenses in the same period as the revenue they help generate.'],
    ['Net debt', 'Total debt minus cash and equivalents.'],
    ['Net operating assets (NOA)', 'Operating assets minus operating liabilities.'],
    ['Non-GAAP measure', 'A financial measure not defined by GAAP (e.g., adjusted EBITDA); regulated in the US by Regulation G and Reg S-K Item 10(e).'],
    ['NOPAT', 'Net operating profit after tax: EBIT × (1 − tax rate).'],
    ['Operating working capital', 'Operating current assets less operating current liabilities, excluding cash and short-term debt.'],
    ['Prepaid expense', 'Cash paid before the related expense is incurred; an asset until used.'],
    ['Quality of earnings', 'How faithfully reported earnings reflect economic performance, and how sustainable they are.'],
    ['Repo 105', 'Lehman Brothers’ accounting treatment of certain repos as sales, used to reduce reported balance sheet size at quarter-ends.'],
    ['Retained earnings', 'Cumulative net income less cumulative dividends; part of equity, not a cash balance.'],
    ['Stock-based compensation (SBC)', 'Employee pay in options or shares; a non-cash expense that dilutes shareholders.'],
    ['Treasury stock', 'Shares repurchased by the company and held, shown as a reduction of equity.'],
    ['Treasury stock method', 'Diluted share calculation assuming option proceeds are used to repurchase shares at the average price.'],
    ['Window dressing', 'Transactions timed around a reporting date to make the balance sheet look better than it usually is.']
  ]
});

}

/* ---------- lessons ---------- */
function openLesson(lid) {
  const { m, l, i } = LESSONS[lid];
  const cards = [{ t: 'intro' }, ...l.cards, { t: 'done' }];
  const nChecks = l.cards.filter(c => c.t === 'check').length, nActs = l.cards.filter(c => ACT[c.t]).length;
  const sess = { xp: 0, missed: 0 };
  let start = 0;
  if (S.resume && S.resume.les === lid && S.resume.idx < cards.length - 1) start = S.resume.idx;
  const nxt = m.lessons[i + 1];
  ovClose = () => { if (S.resume && S.resume.les === lid) { S.resume.open = false; save(); } };
  player({
    title: lessonNo(m, i) + ' · ' + l.title, cards, start, parent: 'module-' + m.id,
    known: q => q.act ? S.acts[q.id] !== undefined : !!S.answered[q.id],
    onShow(idx, c) {
      S.resume = { les: lid, idx, open: true, ts: Date.now() };
      if (c.t === 'done' && !lessonDone(lid)) { S.lessons[lid] = { done: true, at: Date.now() }; sess.xp += 25; addXP(25, true); toast('Lesson complete · +25 XP'); }
      save();
    },
    onAnswer(q, ok) {
      if (q.act) {
        if (S.acts[q.id] === undefined) { S.acts[q.id] = Math.round(ok * 100); const xp = 5 + Math.round(15 * ok); sess.xp += xp; addXP(xp); } else { touchDay(); save(); }
        return;
      }
      tally(ok);
      if (S.answered[q.id] === undefined) { S.answered[q.id] = { c: ok, t: Date.now() }; if (ok) { sess.xp += 10; addXP(10); } }
      if (!ok) { srsMiss(q.id); sess.missed++; }
      save(); refreshChrome();
    },
    intro: () => `<span class="chip intro">${l.lab ? 'Lab' : 'Lesson'} ${lessonNo(m, i)} · ${l.minutes} min</span><h3>${esc(l.title)}</h3>
      <div><div class="eyebrow" style="margin-bottom:6px">You’ll learn</div><ul class="goals">${(l.goals || []).map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>
      <p class="sub">${nActs} hands-on activit${nActs === 1 ? 'y' : 'ies'} · ${nChecks} quick check${nChecks === 1 ? '' : 's'}${lessonDone(lid) ? ' · completed before' : ''}</p>
      <div class="src"><b>Sources</b>${esc(l.sources)}</div>
      <p class="hint">Swipe left or tap Next</p>`,
    done: () => {
      const vals = Object.values(P.ans), right = vals.filter(Boolean).length;
      return `<span class="chip check">Lesson complete</span><h3>${esc(l.title)}</h3>
      <div class="kpis"><div class="kpi"><div class="l">Activities and checks passed</div><div class="v">${right}/${vals.length}</div></div><div class="kpi hl"><div class="l">XP this session</div><div class="v">+${sess.xp}</div></div><div class="kpi"><div class="l">Sent to review</div><div class="v">${sess.missed}</div></div></div>
      ${sess.missed ? '<p class="sub">Missed questions come back in your review queue in about 10 minutes, then at growing intervals.</p>' : ''}
      ${nxt ? `<p class="sub">Up next: <strong>${lessonNo(m, i + 1)} ${esc(nxt.title)}</strong></p>` : `<p class="sub">That was the last lesson in Module ${m.num}. The mastery quiz is next.</p>`}
      <div class="src"><b>Sources</b>${esc(l.sources)}</div>`;
    },

  });
}

/* ---------- mastery quiz ---------- */
function openQuiz(mid) {
  const m = modById(mid), qs = m.quiz || [];
  const cards = [{ t: 'intro' }, ...qs.map(q => ({ t: 'check', q })), { t: 'done' }];
  const res = {}; let pct = 0, recorded = false, xp = 0;
  player({
    title: 'Module ' + m.num + ' · Mastery quiz', cards, start: 0, parent: 'module-' + mid,
    onAnswer(q, ok) { res[q.id] = ok; tally(ok); if (!ok) srsMiss(q.id); save(); },
    onShow(i, c) {
      if (c.t !== 'done' || recorded) return; recorded = true;
      const r = Object.values(res).filter(Boolean).length; pct = Math.round(r / qs.length * 100);
      const prev = S.quiz[mid];
      S.quiz[mid] = { best: Math.max(prev ? prev.best : 0, pct), last: pct, attempts: (prev ? prev.attempts : 0) + 1, at: Date.now() };
      xp = r * 5 + (pct >= 80 && !(prev && prev.best >= 80) ? 50 : 0);
      addXP(xp, true); save(); toast('+' + xp + ' XP');
    },
    intro: () => { const b = S.quiz[mid]; return `<span class="chip check">Mastery quiz</span><h3>${esc(m.title)}</h3>
      <p class="body">${qs.length} questions mixing concepts and calculations. Pass mark: 80%. Every miss goes to your review queue.</p>
      ${b ? `<p class="sub">Best so far: <strong>${b.best}%</strong> · ${b.attempts} attempt${b.attempts > 1 ? 's' : ''}</p>` : ''}
      <p class="hint">Use the formula sheet afterwards, not during.</p>`; },
    done: () => {
      const missed = qs.filter(q => res[q.id] === false);
      return `<span class="chip ${pct >= 80 ? 'check' : 'mistake'}">${pct >= 80 ? 'Passed' : 'Below the 80% pass mark'}</span>
      <div style="display:flex;align-items:center;gap:16px">${ring(pct / 100, 88, 7, pct + '%')}<div><h3>${esc(m.title)}</h3><p class="sub">${qs.length - missed.length} of ${qs.length} correct · +${xp} XP</p></div></div>
      ${missed.length ? `<div class="stack"><div class="eyebrow">Review these</div>${missed.map(q => `<div class="note"><div style="color:var(--fg);margin-bottom:4px">${md(q.q)}</div>${md(q.why)}</div>`).join('')}</div>` : '<p class="body">Clean sheet.</p>'}`;
    },
    doneAction: () => ({ label: 'Back to module', run: closeCurrent })
  });
}

function srcLabel(id) { const x = QIX[id]; if (!x) return ''; return x.l ? 'From ' + lessonNo(x.m, x.m.lessons.indexOf(x.l)) + ' ' + x.l.title : 'From Module ' + x.m.num + ' mastery quiz'; }

  const hit = g => words.every(w => (g.t + ' ' + g.d).toLowerCase().includes(w));
  const hl = s => { let h = esc(s); words.forEach(w => { const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); h = h.replace(re, '<mark>$1</mark>'); }); return h; };
  const items = GLOSS.filter(hit);
  let html = '', last = '';
  items.forEach(g => {
    const L = /[a-z]/i.test(g.t[0]) ? g.t[0].toUpperCase() : '#';
    if (!words.length && L !== last) { html += `<div class="letter">${L}</div>`; last = L; }
    html += `<div class="term"><div class="tt"><span>${hl(g.t)}</span><span class="tag">M${g.m.num}</span></div><div class="dd">${hl(g.d)}</div></div>`;
  });
  $('#glossList').innerHTML = items.length ? (words.length ? `<p class="sub" style="padding:4px 0 8px">${items.length} match${items.length > 1 ? 'es' : ''}</p>` : '') + html : `<div class="empty">No terms match “${esc(glossQ)}”.</div>`;
}
