<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy-Side Curriculum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital@0;1&display=swap">
<style>
/* Layout: one phone-width column (max 600px) with a fixed bottom tab bar; lessons, quizzes and tools open as full-screen card players. Dark by default. */
:root{
  --bg:#0c1016; --surface:#131a23; --surface-2:#1a2330; --line:#263243; --fg:#e7ecf3; --muted:#97a3b6; --faint:#5d6a7d;
  --accent:#f0b13f; --accent-ink:#1b1305; --accent-soft:rgba(240,177,63,.14);
  --good:#45c28c; --good-soft:rgba(69,194,140,.15); --bad:#f06c60; --bad-soft:rgba(240,108,96,.15);
  --info:#6ea9ff; --info-soft:rgba(110,169,255,.14); --violet:#b493ff; --violet-soft:rgba(180,147,255,.14);
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:'IBM Plex Sans Condensed','IBM Plex Sans','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-math:'Source Serif 4','STIX Two Text',Cambria,Georgia,serif;
  --r:14px; --col:600px;
  color-scheme:dark;
}
:root[data-theme="light"], :root.theme-light{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#edf0f5; --line:#d6dce5; --fg:#121821; --muted:#536074; --faint:#8a95a6;
  --accent:#a86a00; --accent-ink:#ffffff; --accent-soft:rgba(168,106,0,.11);
  --good:#16824f; --good-soft:rgba(22,130,79,.11); --bad:#c23a2f; --bad-soft:rgba(194,58,47,.1);
  --info:#2763c9; --info-soft:rgba(39,99,201,.1); --violet:#6c45c9; --violet-soft:rgba(108,69,201,.1);
  color-scheme:light;
}
:root.theme-dark{
  --bg:#0c1016; --surface:#131a23; --surface-2:#1a2330; --line:#263243; --fg:#e7ecf3; --muted:#97a3b6; --faint:#5d6a7d;
  --accent:#f0b13f; --accent-ink:#1b1305; --accent-soft:rgba(240,177,63,.14);
  --good:#45c28c; --good-soft:rgba(69,194,140,.15); --bad:#f06c60; --bad-soft:rgba(240,108,96,.15);
  --info:#6ea9ff; --info-soft:rgba(110,169,255,.14); --violet:#b493ff; --violet-soft:rgba(180,147,255,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:30px}
.h2{font-size:21px}
.sub{color:var(--muted);font-size:15px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.hot{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.resume{display:grid;gap:12px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-soft)}
.resume .rt{font:600 23px/1.15 var(--f-display);text-wrap:balance}
.resume>span:not(.btn){display:block}
.resume .btn{justify-self:start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.due{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.due b{font-family:var(--f-mono);color:var(--accent);font-size:20px}

/* Module + lesson rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;line-height:1.3}
.row .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.row.locked .t{color:var(--muted)}
.tag{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.chev{color:var(--faint);flex:none}
.idx{font:500 13px var(--f-mono);color:var(--muted);width:30px;flex:none;text-align:center}
.check-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);color:transparent}
.check-ic.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.check-ic.part{border-color:var(--accent)}
.ring{flex:none}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ring text{fill:var(--fg);font:600 12px var(--f-mono)}
.ring.full .val{stroke:var(--good)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 14px;white-space:nowrap;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 4px;margin-left:-4px;border:0;background:none;color:var(--muted);font-size:15px}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--fg);flex:none}
.icon-btn svg{width:22px;height:22px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:600 11px/18px var(--f-mono);text-align:center}

/* Overlay player */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.player{display:flex;flex-direction:column;height:100%;width:100%;max-width:640px;margin:0 auto}
.pl-head{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
.pl-head .ttl{flex:1;min-width:0;font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-prog{display:flex;gap:3px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pl-prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pl-prog i.on{background:var(--accent)}
.pl-prog i.cur{background:var(--fg)}
.pl-prog i.ok{background:var(--good)}
.pl-prog i.no{background:var(--bad)}
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.pl-foot{display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
.pl-foot .btn{flex:1}
.pl-foot .btn.ghost{flex:0 0 auto;min-width:96px}
.sheet-head{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:19px;flex:1;min-width:0}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* Cards */
.card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
.card h3{font-size:25px;letter-spacing:-.005em}
.card .body{font-size:17.5px;line-height:1.6}
.card .body strong{font-weight:600;color:var(--fg)}
.card.k-mistake{border-color:var(--bad-soft)}
.card.k-case{border-color:var(--violet-soft)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 9px;border-radius:7px}
.chip.concept{color:var(--info);background:var(--info-soft)}
.chip.example{color:var(--accent);background:var(--accent-soft)}
.chip.mistake{color:var(--bad);background:var(--bad-soft)}
.chip.case{color:var(--violet);background:var(--violet-soft)}
.chip.check{color:var(--good);background:var(--good-soft)}
.chip.tool{color:var(--accent);background:var(--accent-soft)}
.chip.intro{color:var(--muted);background:var(--surface-2)}
.fx{font-family:var(--f-math);font-size:19px;line-height:1.9;background:var(--surface-2);border-radius:12px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.fx i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.25;margin:0 2px}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.note{font-size:14px;line-height:1.5;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note b{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);margin-right:6px}
.rows{display:grid;border-top:1px solid var(--line);font-size:15.5px}
.rows>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows>div>span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:14.5px}
.rows>div:last-child{font-weight:600}
.goals{margin:0;padding-left:20px;display:grid;gap:4px}
.src{font-size:13px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.src b{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);display:block;margin-bottom:3px}
.hint{font-size:13px;color:var(--faint);text-align:center}
@keyframes inR{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
.in-r{animation:inR .22s ease-out}
.in-l{animation:inL .22s ease-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}

/* Questions */
.qp{font-size:18.5px;line-height:1.5;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:16px;line-height:1.4}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:500 13px var(--f-mono);background:var(--surface);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--bg)}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.55}
.numf{display:flex;gap:10px;align-items:stretch}
.numf .inp{flex:1;display:flex;align-items:center;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 12px}
.numf input{flex:1;min-width:0;height:52px;border:0;background:transparent;font:500 20px var(--f-mono);outline:none}
.numf .u{color:var(--muted);font:500 14px var(--f-mono);white-space:nowrap;padding-left:6px}
.numf .inp:focus-within{border-color:var(--accent)}
.numf.ok .inp{border-color:var(--good);background:var(--good-soft)}
.numf.no .inp{border-color:var(--bad);background:var(--bad-soft)}
.fb{display:grid;gap:6px;border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.55}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .v{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.fb.ok .v{color:var(--good)}
.fb.no .v{color:var(--bad)}
.ord{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.ord li{display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 6px 6px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);touch-action:none;user-select:none;-webkit-user-select:none;font-size:15.5px;line-height:1.35;position:relative}
.ord li .grip{flex:none;width:28px;color:var(--faint);display:grid;place-items:center;cursor:grab}
.ord li .lbl{flex:1;min-width:0}
.ord li .mv{flex:none;display:flex;gap:2px}
.ord li .mv button{width:40px;height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center}
.ord li.drag{z-index:2;border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.35);background:var(--surface)}
.ord li.right{border-color:var(--good);background:var(--good-soft)}
.ord li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord.locked li{touch-action:auto}
.ord.locked .mv{display:none}
.ord-key{margin:4px 0 0;padding-left:22px}

/* Tools */
.tool{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tool>*,.stack>*{min-width:0}
.ctrls{display:grid;gap:4px;background:var(--surface-2);border-radius:14px;padding:10px 14px 8px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14.5px}
.sl-top label{color:var(--muted)}
.sl-top output{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;margin:0;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--fg);border:4px solid var(--accent);margin-top:-10px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--fg);border:4px solid var(--accent)}
.sel{display:grid;gap:4px;font-size:14.5px;color:var(--muted)}
.sel select{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);line-height:1.3}
.kpi .v{font:500 19px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.kpi.hl .v{color:var(--accent)}
.chart-box{background:var(--surface-2);border-radius:14px;padding:8px 6px 4px}
.ch{display:block;width:100%;height:auto}
.ch text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .axis{stroke:var(--faint);stroke-width:1}
.ch .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ch .c1{stroke:var(--accent)} .ch .c2{stroke:var(--info)} .ch .c3{stroke:var(--good)} .ch .c4{stroke:var(--bad)} .ch .c5{stroke:var(--faint)}
.ch .dash{stroke-dasharray:6 5}
.ch .dot{stroke-dasharray:2 5}
.ch .thin{stroke-width:1.5}
.ch .pt{stroke:var(--surface-2);stroke-width:2.5}
.ch .f1{fill:var(--accent)} .ch .f2{fill:var(--info)} .ch .f3{fill:var(--good)} .ch .f4{fill:var(--bad)} .ch .f5{fill:var(--faint)}
.ch .lab{fill:var(--fg);font-size:11.5px;font-weight:500}
.ch .vl{stroke:var(--faint);stroke-dasharray:3 4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:4px 8px 6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.c1{background:var(--accent)} .legend i.c2{background:var(--info)} .legend i.c3{background:var(--good)} .legend i.c4{background:var(--bad)} .legend i.c5{background:var(--faint)}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px);color:var(--info)}
.stmt{display:grid;gap:10px}
.stmt .blk{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stmt .blk h4{margin:0 0 4px;font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stmt .ln{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14.5px}
.stmt .ln span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt .ln.tot{border-top:1px solid var(--line);font-weight:600;margin-top:2px;padding-top:6px}
.stmt .ln.sub{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.balance{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;font-size:14.5px;background:var(--good-soft)}
.balance b{color:var(--good);font-family:var(--f-mono)}
.tool-note{font-size:13.5px;color:var(--muted);line-height:1.5}
.sens{overflow-x:auto}
.sens table{border-collapse:separate;border-spacing:3px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;margin:0 auto}
.sens th{color:var(--muted);font-weight:500;padding:6px 6px}
.sens td{padding:8px 6px;border-radius:7px;text-align:right;min-width:58px}
.sens td.base{outline:2px solid var(--accent);outline-offset:-2px}

/* Glossary */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16.5px}
.gl{display:grid;gap:0}
.gl .letter{font:600 13px var(--f-mono);color:var(--accent);padding:16px 0 6px;border-bottom:1px solid var(--line)}
.gl .term{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
.gl .term .tt{font-weight:600;display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.gl .term .dd{font-size:15.5px;color:var(--muted);line-height:1.5}
mark{background:var(--accent-soft);color:var(--fg);border-radius:3px;padding:0 1px}

/* Formula sheet */
.fs{display:grid;gap:10px}
.fs .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.fs .item h3{font-size:17px}
.vars{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.vars dt{font-family:var(--f-math);font-style:italic;font-size:16px;color:var(--fg);white-space:nowrap}
.vars dd{margin:0;color:var(--muted)}

/* Progress */
.grid-rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mring{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:12.5px;line-height:1.3;color:var(--muted);min-height:44px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font:500 24px var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:42px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font:13px/1.4 var(--f-mono);resize:vertical}
.bars14{display:flex;align-items:flex-end;gap:4px;height:64px}
.bars14 span{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars14 span.zero{background:var(--line)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font:500 14px var(--f-mono);padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay-open .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
@media (min-width:700px){
  .card{padding:26px 26px}
  .h1{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<body>
<div id="app">
  <main id="view" class="wrap"></main>
  <nav class="tabbar" aria-label="Main">
    <div class="in" id="tabs"></div>

<script>
/* =====================================================================
   COURSE CONTENT
   ---------------------------------------------------------------------
   All curriculum lives here. The app code below never needs editing to
   add a module: replace a placeholder object (status: 'locked') with a
   full module object that has lessons, quiz, formulas and glossary.

   Module shape:
   { id, num, title, blurb, outline:[lesson titles],          // placeholders
     lessons:[{ id, title, minutes, goals:[], sources:'', cards:[] }],
     quiz:[question], formulas:[{n, f, v:[[symbol, definition]], note}],
     glossary:[[term, definition]] }

   Card types (t): concept | example | mistake | case | check | tool
     concept/mistake/case: { h, b, f?, note? }
     example: { h, b?, rows?:[[label, value]], f? }
     check:   { q: question }
     tool:    { tool: TOOL_ID, h, b }
   Question: { id, kind:'mc'|'num'|'order', q, opts?, a?, unit?, tol?, why }
     mc:    opts[] + a (index of correct option; options are shuffled)
     num:   a (number), unit, tol (absolute; default 1% of |a|)
     order: opts[] listed in the CORRECT order (shuffled on display)
   Markup in text: **bold**, \n = line break, inline HTML allowed.
   ===================================================================== */
window.COURSE = { modules: [] };

/* ------------------------------ MODULE 1 ------------------------------ */
COURSE.modules.push({
  id: 'm1', num: 1, title: 'Financial Accounting',
  blurb: 'The three statements, accruals, how the statements link, working capital, cash flow analysis and quality of earnings.',
  lessons: [

  /* ---------- 1.1 ---------- */
  { id: 'm1-l1', title: 'The Accounting Equation', minutes: 4,
    goals: ['Why every transaction hits two accounts', 'What shareholders’ equity actually represents', 'The retained-earnings bridge between statements'],
    sources: 'CFA Institute, CFA Program Curriculum Level I, Financial Statement Analysis (“Financial Reporting Mechanics”, “Analyzing Balance Sheets”); Berk & DeMarzo, Corporate Finance (“Introduction to Financial Statement Analysis”).',
    cards: [
      { t: 'concept', h: 'One identity holds everything',
        f: 'Assets = Liabilities + Shareholders’ Equity',
        b: `**Assets** are resources the firm controls that should produce future benefits. **Liabilities** are obligations to outsiders. **Equity** is the residual claim: what is left for shareholders after every creditor is paid. Because the identity always holds, every transaction changes at least two accounts. On a desk that is a sanity check: if cash moved, something else moved too.` },
      { t: 'concept', h: 'Double entry in 30 seconds',
        b: `Every transaction is recorded with equal debits and credits. **Debits** increase assets and expenses. **Credits** increase liabilities, equity and revenue. You won’t post journal entries at a fund, but thinking in pairs is how you debug a model. When the balance sheet is off by $12.4m, look for the transaction where only one side was booked.` },
      { t: 'example', h: 'Five transactions, one balance sheet',
        rows: [['Raise $100 of equity', 'Cash +100 · Equity +100'], ['Borrow $50', 'Cash +50 · Debt +50'], ['Buy $60 of equipment for cash', 'Cash −60 · PP&E +60'], ['Buy $20 of inventory on credit', 'Inventory +20 · Payables +20'], ['Ending position', 'Assets 170 = Liab. 70 + Equity 100']],
        b: `Cash ends at 90, PP&E at 60, inventory at 20. Every row keeps both sides equal.` },
      { t: 'check', q: { id: 'm1-l1-q1', kind: 'mc',
        q: 'A company buys $30 of inventory on credit from a supplier. What happens to its balance sheet?',
        opts: ['Assets +30, liabilities +30', 'Assets +30, equity +30', 'Cash −30, inventory +30', 'No change until the invoice is paid'], a: 0,
        why: `Inventory (an asset) and accounts payable (a liability) both rise by $30. Cash doesn’t move until the supplier is paid, and there is no expense yet because nothing has been sold.` } },
      { t: 'concept', h: 'Equity is a tally, not a pile of cash',
        b: `Shareholders’ equity = contributed capital (common stock + additional paid-in capital) + retained earnings − treasury stock ± accumulated other comprehensive income. **Retained earnings** is cumulative net income minus cumulative dividends. It is not cash. A firm can show $5bn of retained earnings and $200m of cash because the profits went into plants, inventory or acquisitions.` },
      { t: 'mistake', h: 'Treating book value as market value',
        b: `Book equity reflects historical cost and accounting rules. Market cap reflects expected future cash flows. A software firm with $2bn of book equity can be worth $40bn because its main assets (code, customer relationships, brand) were mostly expensed, never capitalized. Price-to-book is most useful for banks and insurers, whose assets are largely financial and carried near fair value.` },
      { t: 'check', q: { id: 'm1-l1-q2', kind: 'num',
        q: 'Total assets are $840m and total liabilities are $510m. What is book equity?', a: 330, unit: '$m',
        why: `Equity = Assets − Liabilities = 840 − 510 = $330m.` } },
      { t: 'concept', h: 'The retained-earnings roll-forward',
        f: 'RE<sub>end</sub> = RE<sub>begin</sub> + NI − Dividends',
        b: `This line is the bridge between the income statement and the balance sheet, and modelers check it every period. If it doesn’t roll, something hit equity directly (an accounting-standard transition adjustment, for example) or a dividend is missing. Buybacks usually sit in treasury stock, although companies that retire repurchased shares may charge part of the cost to retained earnings.` },
      { t: 'check', q: { id: 'm1-l1-q3', kind: 'num',
        q: 'Beginning retained earnings $1,200m, net income $300m, dividends declared $90m. What are ending retained earnings?', a: 1410, unit: '$m',
        why: `1,200 + 300 − 90 = $1,410m. Dividends reduce retained earnings when declared. They never appear on the income statement.` } },
      { t: 'check', q: { id: 'm1-l1-q4', kind: 'mc',
        q: 'Which transaction changes total assets but leaves equity unchanged?',
        opts: ['Borrowing $100 from a bank', 'Paying a $100 cash dividend', 'Earning $100 of revenue in cash', 'Recording $100 of depreciation'], a: 0,
        why: `Borrowing adds cash and an equal liability. The other three all change equity: dividends reduce retained earnings, revenue raises it through net income, and depreciation lowers it through net income.` } }
    ] },

  /* ---------- 1.2 ---------- */
  { id: 'm1-l2', title: 'The Income Statement', minutes: 6,
    goals: ['Read a P&L from revenue to diluted EPS', 'How revenue recognition (ASC 606 / IFRS 15) works', 'Why EBITDA is useful and dangerous'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Income Statements”); FASB ASC 606 and IFRS 15, Revenue from Contracts with Customers; SEC Regulation G and Regulation S-K Item 10(e) on non-GAAP financial measures.',
    cards: [
      { t: 'concept', h: 'From the top line to EPS',
        b: `Revenue − cost of goods sold = **gross profit**. Minus operating expenses (SG&A, R&D) = **operating income**, usually treated as EBIT. Minus interest = **pre-tax income**. Minus taxes = **net income**. Divide by diluted shares for **diluted EPS**. The income statement covers a period, such as a quarter or a year. The balance sheet is a snapshot at one date.`,
        note: 'EBIT and operating income are often used interchangeably, but definitions differ on non-operating items. Check what a given EBIT includes.' },
      { t: 'example', h: 'Read a P&L the way a desk does',
        rows: [['Revenue', '1,000'], ['Cost of goods sold', '(600)'], ['Gross profit · 40.0% margin', '400'], ['SG&A', '(150)'], ['R&D', '(50)'], ['EBIT · 20.0% margin', '200'], ['Interest expense', '(20)'], ['Pre-tax income', '180'], ['Taxes at 25%', '(45)'], ['Net income · 13.5% margin', '135'], ['Diluted EPS on 50m shares', '$2.70']],
        b: `$m except per share. Margins, not levels, get compared across peers and quarters.` },
      { t: 'check', q: { id: 'm1-l2-q1', kind: 'num',
        q: 'Revenue $500m, COGS $320m, SG&A $80m. What is the operating margin?', a: 20, unit: '%',
        why: `Operating income = 500 − 320 − 80 = $100m. Operating margin = 100 / 500 = 20%.` } },
      { t: 'concept', h: 'Revenue recognition in five steps',
        b: `Under ASC 606 / IFRS 15, revenue is recognized when control of a good or service passes to the customer, not when cash arrives. The steps: (1) identify the contract, (2) identify the performance obligations, (3) determine the transaction price, (4) allocate it to the obligations, (5) recognize revenue as each obligation is satisfied. US public companies adopted it for fiscal years beginning after Dec 15, 2017.` },
      { t: 'check', q: { id: 'm1-l2-q2', kind: 'order',
        q: 'Put the ASC 606 five-step model in order.',
        opts: ['Identify the contract', 'Identify performance obligations', 'Determine the transaction price', 'Allocate the price to obligations', 'Recognize revenue as obligations are satisfied'],
        why: `Contract → obligations → price → allocation → recognition. Most of the judgment sits in steps 2 and 4: what counts as a separate obligation, and how the price is split between them.` } },
      { t: 'example', h: 'An annual SaaS contract',
        b: `A customer signs a 12-month, $120,000 subscription on Jan 1 and pays upfront. Q1 cash received: $120,000. Q1 revenue: $30,000 (3 of 12 months). The other $90,000 sits on the balance sheet as **deferred revenue**, a liability, and is recognized at $10,000 a month. Strong bookings show up in cash and deferred revenue before they show up in revenue.` },
      { t: 'check', q: { id: 'm1-l2-q3', kind: 'mc',
        q: 'Same contract. What is deferred revenue on March 31?',
        opts: ['$90,000', '$120,000', '$30,000', '$0'], a: 0,
        why: `Three months of service have been delivered, so $30,000 is recognized. The remaining $90,000 is service still owed to the customer, so it stays a liability.` } },
      { t: 'concept', h: 'EBITDA', f: 'EBITDA = EBIT + D&amp;A',
        b: `EBITDA is the market’s favorite proxy for operating cash generation and the base for EV/EBITDA multiples and leverage covenants (debt/EBITDA). It is **non-GAAP**: SEC rules (Regulation G, Reg S-K Item 10(e)) require companies that present it to reconcile it to the most comparable GAAP measure. It ignores capex, working capital and taxes, so it flatters capital-intensive businesses.` },
      { t: 'mistake', h: 'Taking “adjusted” numbers at face value',
        b: `Adjusted EBITDA often excludes stock-based compensation, restructuring charges that recur every year, and “one-time” items that aren’t. SBC is a real cost, paid in shares instead of cash. If a company has had “non-recurring” charges in five of the last six years, they are recurring. Rebuild your own adjusted figure instead of using management’s.` },
      { t: 'case', h: 'Groupon’s ACSOI (2011)',
        b: `Groupon’s 2011 IPO filing featured “Adjusted Consolidated Segment Operating Income,” a metric that excluded online marketing, its main cost of acquiring customers. After SEC staff comments, the company dropped the metric from its amended filing. When a non-GAAP measure excludes the cost a business needs in order to grow, it describes a business that doesn’t exist.` },
      { t: 'check', q: { id: 'm1-l2-q4', kind: 'mc',
        q: 'A US-listed company presents “Adjusted EBITDA” in its earnings release. What do SEC rules require alongside it?',
        opts: ['A reconciliation to the most directly comparable GAAP measure', 'A separate audit opinion on the adjusted figure', 'Ten years of history for the measure', 'Nothing; non-GAAP measures are unregulated'], a: 0,
        why: `Regulation G (and Item 10(e) of Reg S-K for SEC filings) requires a reconciliation to the closest GAAP measure. In filings, the GAAP measure must also be presented with equal or greater prominence. The adjusted figure isn’t separately audited.` } },
      { t: 'concept', h: 'Diluted EPS and the treasury stock method',
        f: 'Net new shares = <i>n</i> × (<i>P̄</i> − <i>K</i>) / <i>P̄</i>',
        b: `Basic EPS = (net income − preferred dividends) / weighted average shares. Diluted EPS adds potential shares from options, RSUs and convertibles. For options, the **treasury stock method** assumes the exercise proceeds buy back stock at the average price P̄, so only net new shares count. Options with K above P̄ are anti-dilutive and excluded.` },
      { t: 'check', q: { id: 'm1-l2-q5', kind: 'num',
        q: '1,000,000 in-the-money options with a $40 strike; average share price $50. How many net new shares does the treasury stock method add?', a: 200000, unit: 'shares',
        why: `Exercise proceeds = 1,000,000 × $40 = $40m, which buys back $40m / $50 = 800,000 shares. Net new shares = 1,000,000 − 800,000 = 200,000. Shortcut: n × (P̄ − K) / P̄.` } }
    ] },

  /* ---------- 1.3 ---------- */
  { id: 'm1-l3', title: 'The Balance Sheet', minutes: 6,
    goals: ['How assets and liabilities are measured', 'Net debt, leases and goodwill', 'LIFO vs FIFO and the LIFO reserve'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Balance Sheets”, “Analysis of Inventories”, “Analysis of Long-Term Assets”); FASB ASC 350 (goodwill), ASC 842 and IFRS 16 (leases), IAS 38 (intangibles); Koller, Goedhart & Wessels, Valuation (McKinsey & Company).',
    cards: [
      { t: 'concept', h: 'A snapshot, sorted by liquidity',
        b: `Assets run from most to least liquid: cash, receivables and inventory (current, meaning expected to convert within a year or one operating cycle), then PP&E, intangibles and goodwill. Liabilities follow the same order: payables, accrued expenses, deferred revenue, short-term debt, then long-term debt, leases and deferred taxes. Analysts re-sort it into **operating** and **financing** items. That split is how invested capital and enterprise value are built.` },
      { t: 'concept', h: 'Book value is a patchwork',
        b: `Assets aren’t all at market value. PP&E is at historical cost less accumulated depreciation. Inventory is at the lower of cost and net realizable value (lower of cost or market for LIFO under US GAAP). Many financial assets are at fair value. Internally built intangibles, such as brands and most R&D, are expensed and never appear. “Book value” mixes several measurement bases.` },
      { t: 'check', q: { id: 'm1-l3-q1', kind: 'mc',
        q: 'A US pharma company spent $8bn on internal R&D over a decade and built a valuable drug pipeline. Where is most of that pipeline on its balance sheet?',
        opts: ['Mostly absent: internal R&D is expensed as incurred', 'In intangible assets at fair value', 'In goodwill', 'In PP&E at historical cost'], a: 0,
        why: `Under US GAAP, internal R&D is expensed as incurred, so the pipeline is mostly off the balance sheet. IFRS (IAS 38) lets companies capitalize development costs once strict criteria are met, but research is always expensed. Buy the same pipeline in a business combination and it does appear, as an acquired intangible.` } },
      { t: 'example', h: 'Net debt, two ways',
        rows: [['Cash', '300'], ['Short-term debt', '100'], ['Long-term debt', '900'], ['Operating lease liabilities', '150'], ['Net debt excluding leases', '100 + 900 − 300 = 700'], ['Net debt including leases', '700 + 150 = 850']],
        b: `$m. Which one you use depends on how your EBITDA treats rent. See the next card.` },
      { t: 'mistake', h: 'Counting leases twice, or not at all',
        b: `Since 2019, ASC 842 and IFRS 16 put most leases on the balance sheet. Under IFRS 16, lease cost becomes depreciation plus interest, so EBITDA goes up. Under US GAAP, operating-lease cost stays in operating expense. If you add lease liabilities to EV, pair them with EBITDA before rent (EBITDAR), or you penalize the company twice. Comparing IFRS and US GAAP peers without adjusting distorts EV/EBITDA.` },
      { t: 'check', q: { id: 'm1-l3-q2', kind: 'num',
        q: 'Cash $250m, revolver drawn $50m, bonds outstanding $600m. What is net debt, excluding leases?', a: 400, unit: '$m',
        why: `Net debt = total debt − cash = (50 + 600) − 250 = $400m.` } },
      { t: 'concept', h: 'Goodwill', f: 'Goodwill = Price paid − FV of identifiable net assets',
        b: `When an acquirer pays more than the fair value of the target’s identifiable net assets, the excess is goodwill. US GAAP (for public companies) and IFRS don’t amortize it; they test it for impairment at least annually. An impairment is non-cash, but it admits the deal destroyed value. It often arrives years after the market priced in the damage.` },
      { t: 'example', h: 'Goodwill from a deal',
        b: `A buyer pays $1,000m for a target whose identifiable assets have a fair value of $900m, with $300m of liabilities. Net identifiable assets = $600m, so goodwill = **$400m**. A later $150m impairment cuts pre-tax income by $150m (often with no tax benefit) and reduces equity. Cash is untouched, so the charge is added back in CFO.` },
      { t: 'check', q: { id: 'm1-l3-q3', kind: 'num',
        q: 'Purchase price $2.5bn. Fair value of identifiable assets $3.1bn; liabilities assumed $1.4bn. What is goodwill?', a: 0.8, tol: 0.001, unit: '$bn',
        why: `Net identifiable assets = 3.1 − 1.4 = $1.7bn. Goodwill = 2.5 − 1.7 = $0.8bn.` } },
      { t: 'concept', h: 'Inventory: FIFO vs LIFO',
        b: `When prices rise, **LIFO** (last in, first out) charges the newest, highest costs to COGS: lower profit, lower taxes, and an inventory balance stuck at old prices. **FIFO** does the opposite. LIFO is allowed under US GAAP but not IFRS. US LIFO users disclose the **LIFO reserve** (FIFO inventory − LIFO inventory) so analysts can restate them to FIFO.` },
      { t: 'check', q: { id: 'm1-l3-q4', kind: 'mc',
        q: 'Prices are rising. Firm A uses LIFO, Firm B uses FIFO; they are otherwise identical. Which is true?',
        opts: ['A has higher COGS and pays less tax', 'A reports higher inventory', 'B reports higher COGS', 'Both report the same net income'], a: 0,
        why: `LIFO expenses the most recent, higher costs, so A’s COGS is higher, its pre-tax income lower and its cash taxes lower. A’s inventory is carried at older, lower costs.` } },
      { t: 'concept', h: 'Restating LIFO to FIFO',
        f: 'Inv<sub>FIFO</sub> = Inv<sub>LIFO</sub> + LIFO reserve<br>COGS<sub>FIFO</sub> = COGS<sub>LIFO</sub> − ΔLIFO reserve',
        b: `This is the standard CFA adjustment. On a FIFO basis, equity rises by the LIFO reserve × (1 − t), because the extra cumulative profit would have been taxed. The remaining reserve × t goes to a deferred tax liability (or lower cash, if you assume the taxes were paid).` },
      { t: 'check', q: { id: 'm1-l3-q5', kind: 'num',
        q: 'LIFO COGS is $2,000m. The LIFO reserve rose from $100m to $120m during the year. What is COGS on a FIFO basis?', a: 1980, unit: '$m',
        why: `COGS_FIFO = 2,000 − (120 − 100) = $1,980m. A rising LIFO reserve means LIFO charged more cost to COGS than FIFO would have.` } }
    ] },

  /* ---------- 1.4 ---------- */
  { id: 'm1-l4', title: 'Accrual Accounting', minutes: 5,
    goals: ['Why accrual profit and cash diverge', 'The four types of accrual', 'Where judgment, and manipulation, enters'],
    sources: 'CFA Program Curriculum Level I (“Financial Reporting Mechanics”, “Analyzing Income Statements”); FASB ASC 340-40 (contract costs) and ASC 326 (current expected credit losses); SEC v. Albert J. Dunlap et al. (Sunbeam), complaint filed May 2001.',
    cards: [
      { t: 'concept', h: 'Accrual vs cash',
        b: `Under accrual accounting, revenue is recorded when earned and expenses when incurred, whatever the timing of cash. That is how a profitable company can run out of money, and how a loss-making one can pile up cash. The income statement measures economic performance. The cash flow statement tells you whether that performance turned into money.` },
      { t: 'concept', h: 'The four accruals',
        b: `Every timing gap is one of four types:\n**Accrued revenue**: earned, not yet received → receivable (asset).\n**Deferred revenue**: received, not yet earned → liability.\n**Accrued expense**: incurred, not yet paid → liability.\n**Prepaid expense**: paid, not yet incurred → asset.\nEach reverses later, when the cash or the earning catches up.` },
      { t: 'check', q: { id: 'm1-l4-q1', kind: 'mc',
        q: 'On July 1 a company prepays 12 months of insurance for $24,000. What prepaid asset is on its September 30 balance sheet?',
        opts: ['$18,000', '$24,000', '$6,000', '$0'], a: 0,
        why: `Three months ($6,000) have been used and expensed. Nine months of coverage remain, so the prepaid asset is $18,000.` } },
      { t: 'check', q: { id: 'm1-l4-q2', kind: 'mc',
        q: 'December wages of $40,000 are paid on January 5. What goes into December’s accounts?',
        opts: ['Wage expense of $40,000 and an accrued liability of $40,000', 'No entry until the cash is paid', 'A prepaid asset of $40,000', 'A $40,000 reduction in cash'], a: 0,
        why: `The expense was incurred in December, so it is recorded then, along with an accrued liability. In January the payment reduces cash and clears the liability, with no new expense.` } },
      { t: 'concept', h: 'The matching principle',
        b: `Costs are matched to the revenue they help produce. A $100m machine used for 10 years is depreciated, not expensed on day one. Sales commissions on a three-year contract can be capitalized and amortized over the contract (ASC 340-40). Matching makes margins comparable across periods. Every capitalization decision is also a judgment that management can stretch.` },
      { t: 'example', h: 'Same machine, two depreciation methods',
        f: 'Straight-line = (Cost − Salvage) / Useful life',
        b: `Cost $100m, 10-year life, $10m salvage value.\n**Straight-line:** (100 − 10) / 10 = $9m a year.\n**Double-declining balance, year 1:** 2/10 × $100m = $20m (salvage only limits the later years).\nSame asset, same cash, yet year-1 pre-tax profit differs by $11m purely from the method chosen.` },
      { t: 'check', q: { id: 'm1-l4-q3', kind: 'num',
        q: 'An asset costs $50m, has a $5m salvage value and a 9-year useful life. What is straight-line annual depreciation?', a: 5, unit: '$m',
        why: `(50 − 5) / 9 = $5m a year.` } },
      { t: 'mistake', h: 'Missing a change in useful life',
        b: `Lengthening asset lives cuts annual depreciation and lifts EPS with no change in the business. It can be justified, but it is disclosed in the notes, not the headline. Microsoft and Alphabet extended the useful lives of their servers to six years in 2022 and 2023, and both disclosed the expected effect on results. When margins jump, read the depreciation policy note first.` },
      { t: 'concept', h: 'Estimates inside accruals',
        b: `Many accruals are estimates. Receivables are shown net of an **allowance for credit losses** (the CECL model under US GAAP, adopted by most SEC filers in 2020). Warranty, returns and legal reserves are estimates too. Under-reserving inflates today’s earnings, and releasing reserves built in earlier years can quietly manufacture a beat. Track each reserve as a percentage of the exposure it covers.` },
      { t: 'check', q: { id: 'm1-l4-q4', kind: 'mc',
        q: 'Receivables grew 15% and revenue grew 15%, but the allowance for doubtful accounts fell 20%. What is the most likely implication?',
        opts: ['Earnings quality may be weaker: lower provisions boosted profit', 'Operating cash flow improved', 'Customer credit quality definitely improved', 'No effect on earnings'], a: 0,
        why: `A smaller allowance against a bigger receivables book means a lower provision expense, which lifts earnings. Better credit could justify it, but you’d want evidence, such as falling write-offs, before believing it.` } },
      { t: 'case', h: 'Sunbeam: pulling sales forward',
        b: `According to SEC charges filed in 2001, Sunbeam under CEO Al Dunlap inflated its 1997 results with “bill-and-hold” sales, booking revenue on goods customers agreed to buy that stayed in Sunbeam’s warehouses, along with other techniques that pulled future sales into the year. The restatement erased much of the reported turnaround. Revenue timing is a recurring theme in SEC enforcement.` }
    ] },

  /* ---------- 1.5 ---------- */
  { id: 'm1-l5', title: 'The Cash Flow Statement', minutes: 5,
    goals: ['The three sections and what goes where', 'Building CFO with the indirect method', 'How capitalizing costs inflates operating cash flow'],
    sources: 'CFA Program Curriculum Level I (“Analyzing Statements of Cash Flows I & II”); FASB ASC 230; IASB IAS 7 and IFRS 18 (issued April 2024); SEC v. WorldCom, Inc., complaint filed June 26, 2002.',
    cards: [
      { t: 'concept', h: 'Three sections',
        b: `**Operating (CFO):** cash from running the business. **Investing (CFI):** capex, acquisitions, buying and selling securities. **Financing (CFF):** debt raised or repaid, shares issued or repurchased, dividends paid. The three sum to the change in cash. Cash flow is harder to manipulate than earnings, though not impossible, which is why skeptical analysts start here.` },
      { t: 'concept', h: 'The indirect method',
        b: `Nearly every company presents CFO indirectly. Start with net income. Add back non-cash charges (D&A, SBC, impairments, deferred taxes). Remove non-cash gains. Then adjust for working capital. The rule to remember: **an increase in an operating asset uses cash; an increase in an operating liability provides cash.**` },
      { t: 'example', h: 'Building CFO',
        rows: [['Net income', '135'], ['+ D&A', '40'], ['+ Stock-based comp', '15'], ['− Increase in receivables', '(30)'], ['− Increase in inventory', '(20)'], ['+ Increase in payables', '10'], ['+ Increase in deferred revenue', '5'], ['Cash from operations', '155']],
        b: `$m. CFO beats net income here because non-cash charges exceed the working capital build.` },
      { t: 'check', q: { id: 'm1-l5-q1', kind: 'num',
        q: 'Net income $80m, D&A $25m, receivables up $15m, payables up $6m, inventory down $4m. What is CFO?', a: 100, unit: '$m',
        why: `80 + 25 − 15 + 6 + 4 = $100m. Falling inventory releases cash; rising receivables absorb it.` } },
      { t: 'mistake', h: 'Getting working-capital signs backwards',
        b: `The classic slip is adding an increase in receivables. If AR rose $30m, you booked $30m of revenue you haven’t collected, so subtract it. Memory aid: assets up, cash down; liabilities up, cash up. A fall in AR is a source of cash, because customers paid you.` },
      { t: 'concept', h: 'Where interest and dividends go',
        b: `Under US GAAP, interest paid, interest received and dividends received are operating cash flows; dividends paid are financing. IAS 7 has allowed choices, such as reporting interest paid in operating or financing, which hurts comparability. IFRS 18, effective for periods beginning on or after 1 January 2027, removes most of those choices for non-financial companies.`,
        note: 'IFRS 18 effective date and details as of November 2026; verify current.' },
      { t: 'check', q: { id: 'm1-l5-q2', kind: 'mc',
        q: 'Under US GAAP, where does interest paid on debt appear?',
        opts: ['Operating activities', 'Investing activities', 'Financing activities', 'It isn’t on the cash flow statement'], a: 0,
        why: `US GAAP classifies interest paid as operating, even though debt itself is a financing item. That is why the FCFF formula adds after-tax interest back to CFO (lesson 1.8).` } },
      { t: 'case', h: 'WorldCom (2002)',
        b: `WorldCom recorded ordinary “line costs” (fees paid to other carriers to carry its traffic) as capital expenditures. That moved them off the income statement, lifting EBITDA and net income, and shifted the outflow from operating to investing, inflating CFO. The SEC’s June 2002 complaint cited about $3.8bn of improperly capitalized costs. WorldCom filed for bankruptcy in July 2002.` },
      { t: 'check', q: { id: 'm1-l5-q3', kind: 'mc',
        q: 'A firm wrongly capitalizes $100m of operating costs this year. Ignoring taxes, which statement is FALSE?',
        opts: ['Net income falls', 'CFO rises by $100m', 'CFI falls by $100m', 'The total change in cash is unaffected'], a: 0,
        why: `Capitalizing removes the cost from this year’s income statement, so net income rises (until the asset is depreciated). On the cash flow statement the outflow moves from operating to investing. Total cash is unchanged because the money was spent either way.` } },
      { t: 'concept', h: 'Capex and free cash flow', f: 'FCF (shorthand) = CFO − Capex',
        b: `Capex sits in investing, so CFO alone overstates what owners can take out. The common shorthand is CFO minus capex. Valuation uses precise versions, FCFF and FCFE, covered in lesson 1.8. Sell-side notes and company releases define “free cash flow” differently, so check the definition before you compare two numbers.` },
      { t: 'check', q: { id: 'm1-l5-q4', kind: 'order',
        q: 'Order the cash flow statement from top to bottom (indirect method).',
        opts: ['Net income', 'Add back non-cash charges', 'Changes in working capital', 'Cash from investing activities', 'Cash from financing activities', 'Net change in cash'],
        why: `Net income, then non-cash items, then working capital gives CFO. Investing and financing follow. The three sections sum to the net change in cash, which ties to the balance sheet.` } }
    ] },

  /* ---------- 1.6 ---------- */
  { id: 'm1-l6', title: 'How the Three Statements Link', minutes: 6,
    goals: ['The three links that make a model balance', 'Walk any transaction through IS, CFS and BS', 'Interview classics: depreciation, asset sales, SBC'],
    sources: 'CFA Program Curriculum Level I (“Financial Reporting Mechanics”); Rosenbaum & Pearl, Investment Banking: Valuation, LBOs, M&A, and IPOs (LBO model chapters); Koller, Goedhart & Wessels, Valuation (McKinsey & Company).',
    cards: [
      { t: 'concept', h: 'Three wires',
        b: `Three links connect the statements:\n1. **Net income** flows from the income statement to the top of the cash flow statement, and into retained earnings.\n2. **Non-cash items and working-capital changes** on the cash flow statement mirror movements on the balance sheet.\n3. **Ending cash** on the cash flow statement becomes cash on the balance sheet.\nIf a model doesn’t balance, one wire is cut.` },
      { t: 'example', h: 'The classic: depreciation up $10',
        b: `Tax rate 25%.\n**IS:** depreciation +$10 → pre-tax income −$10 → taxes −$2.50 → **net income −$7.50**.\n**CFS:** net income −$7.50, add back depreciation +$10 → **cash +$2.50**.\n**BS:** cash +$2.50, PP&E −$10, so assets −$7.50; retained earnings −$7.50. Balanced. The $2.50 of cash is the tax shield.` },
      { t: 'check', q: { id: 'm1-l6-q1', kind: 'num',
        q: 'Depreciation rises by $20; the tax rate is 21%. What is the change in cash?', a: 4.2, tol: 0.011, unit: '$',
        why: `Net income falls 20 × (1 − 0.21) = $15.80. Add back $20 of depreciation and cash rises $4.20: the tax shield, 20 × 0.21.` } },
      { t: 'tool', tool: 'threeStatement', h: 'Walk it through yourself',
        b: `Pick an event, change the amount and tax rate, and watch all three statements and the balance check update.` },
      { t: 'example', h: 'Buying inventory with cash',
        b: `Buy $50 of inventory for cash.\n**IS:** nothing. No sale yet, so no COGS.\n**CFS:** increase in inventory, −$50 in CFO.\n**BS:** cash −$50, inventory +$50; total assets unchanged.\nWhen it’s later sold for $80: revenue +$80, COGS +$50, pre-tax profit +$30.` },
      { t: 'check', q: { id: 'm1-l6-q2', kind: 'mc',
        q: 'A company issues $100 of debt and immediately spends it on equipment. What is the net effect on cash?',
        opts: ['Zero', '+$100', '−$100', 'It depends on the tax rate'], a: 0,
        why: `CFF +$100 and CFI −$100. PP&E rises $100 and debt rises $100. Nothing hits the income statement until the equipment is depreciated and interest accrues.` } },
      { t: 'example', h: 'Selling an asset at a gain',
        b: `Sell equipment with a $40 book value for $60 cash; tax 25%.\n**IS:** gain +$20 → taxes +$5 → net income +$15.\n**CFS:** net income +$15, subtract the non-cash gain −$20 in CFO, proceeds +$60 in CFI → **cash +$55**.\n**BS:** cash +$55, PP&E −$40, so assets +$15; retained earnings +$15. The gain comes out of CFO so the full proceeds show in investing.` },
      { t: 'check', q: { id: 'm1-l6-q3', kind: 'num',
        q: 'Equipment with a $70 book value is sold for $50 cash; the tax rate is 25%. What is the total change in cash?', a: 55, unit: '$',
        why: `The $20 loss cuts net income by $15 (it saves $5 of tax). CFO: −15 + 20 (add back the loss) = +$5. CFI: +$50. Cash rises $55: the proceeds plus the tax saved.` } },
      { t: 'mistake', h: 'Forgetting the tax line',
        b: `Interviewers ask the depreciation question because candidates say “cash is unchanged, depreciation is non-cash.” Depreciation is non-cash, but it is tax-deductible, so it changes cash taxes. These examples assume book and tax depreciation are equal. In practice they differ, and the gap creates deferred tax assets and liabilities.` },
      { t: 'check', q: { id: 'm1-l6-q4', kind: 'mc',
        q: 'A company records $30 of stock-based compensation; tax rate 25%. Assume the expense is deductible now. Which is correct?',
        opts: ['Net income −22.5, cash +7.5, total equity +7.5', 'Net income −30, cash −30', 'Net income −22.5, cash −22.5', 'No effect, because SBC is non-cash'], a: 0,
        why: `Net income falls 30 × 0.75 = 22.5. CFO adds back the $30 non-cash expense, so cash rises 7.5 (the tax saving). Equity: paid-in capital +30, retained earnings −22.5, net +7.5, matching the cash. In practice the US tax deduction arrives at vesting or exercise, not when the expense is booked.` } },
      { t: 'concept', h: 'Circularity in models',
        b: `In a full model, interest expense depends on average debt, debt depends on the cash sweep, and the cash sweep depends on net income after interest. That is a circular reference. Modelers either enable iterative calculation with a circuit-breaker switch, or calculate interest on beginning-of-period balances. Know which your model does; it is a common reason a balance sheet suddenly breaks.` }
    ] },

  /* ---------- 1.7 ---------- */
  { id: 'm1-l7', title: 'Working Capital', minutes: 5,
    goals: ['Operating working capital vs the accounting definition', 'DSO, DIO, DPO and the cash conversion cycle', 'Why growth consumes cash'],
    sources: 'CFA Program Curriculum Level I (“Financial Analysis Techniques”; Corporate Issuers, working capital and liquidity); Koller, Goedhart & Wessels, Valuation (McKinsey & Company); Berk & DeMarzo, Corporate Finance (“Working Capital Management”); Report of Examiner Anton R. Valukas, In re Lehman Brothers Holdings Inc. (March 2010).',
    cards: [
      { t: 'concept', h: 'Operating working capital',
        b: `The accounting definition is current assets − current liabilities. For valuation, use **operating** working capital: receivables + inventory + prepaid expenses − payables − accrued expenses − deferred revenue. Leave out cash and short-term debt; they are financing items. An increase in operating working capital is cash invested in the business, just like capex.` },
      { t: 'concept', h: 'Three day-counts',
        f: 'DSO = <span class="fr"><span>Receivables</span><span>Revenue</span></span> × 365 &nbsp; DIO = <span class="fr"><span>Inventory</span><span>COGS</span></span> × 365<br>DPO = <span class="fr"><span>Payables</span><span>COGS</span></span> × 365 &nbsp; CCC = DSO + DIO − DPO',
        b: `The **cash conversion cycle** counts the days cash is tied up between paying suppliers and collecting from customers. Conventions vary: some analysts use average balances, 360 days, or purchases instead of COGS for DPO. Pick one and apply it consistently across peers.` },
      { t: 'example', h: 'Compute the cycle',
        rows: [['Revenue / COGS', '730 / 438'], ['Receivables 80', 'DSO = 80/730 × 365 = 40'], ['Inventory 60', 'DIO = 60/438 × 365 = 50'], ['Payables 48', 'DPO = 48/438 × 365 = 40'], ['Cash conversion cycle', '40 + 50 − 40 = 50 days']],
        b: `$m and days.` },
      { t: 'check', q: { id: 'm1-l7-q1', kind: 'num',
        q: 'Annual revenue is $365m and receivables are $45m. What is DSO?', a: 45, unit: 'days',
        why: `45 / 365 × 365 = 45 days. With revenue of $1m a day, $45m of receivables is 45 days of sales.` } },
      { t: 'concept', h: 'What one day is worth',
        b: `One day of DSO ties up revenue ÷ 365 in cash. At $3.65bn of revenue, one extra day of DSO absorbs $10m. That is why working-capital programs (faster collections, longer supplier terms, supply-chain finance) can release hundreds of millions without changing profit. It is also why a sudden jump in DSO needs an explanation.` },
      { t: 'tool', tool: 'ccc', h: 'Cash conversion cycle',
        b: `Move DSO, DIO and DPO and watch how much cash the cycle ties up.` },
      { t: 'check', q: { id: 'm1-l7-q2', kind: 'num',
        q: 'Revenue is $1,825m. DSO falls from 50 to 44 days. How much cash is released?', a: 30, unit: '$m',
        why: `Revenue per day = 1,825 / 365 = $5m. Six fewer days × $5m = $30m released.` } },
      { t: 'mistake', h: 'Assuming growth funds itself',
        b: `A growing business must fund extra receivables and inventory before customers pay. If the cycle is about 60 days of revenue, growing from $1.0bn to $1.3bn ties up roughly 60/365 × $300m ≈ $49m. Profitable fast-growers can run out of cash this way.`,
        note: 'Simplification: this treats the whole cycle as days of revenue. A full build uses COGS for inventory and payables.' },
      { t: 'case', h: 'Negative working capital',
        b: `Some retailers collect from customers within days (card payments) but pay suppliers over weeks or months. That produces a **negative** cash conversion cycle: suppliers effectively finance growth. Amazon is the textbook example. The flip side: if growth stalls or reverses, the float shrinks and the business starts consuming cash.` },
      { t: 'check', q: { id: 'm1-l7-q3', kind: 'mc',
        q: 'Which change releases cash, all else equal?',
        opts: ['DPO rises from 30 to 45 days', 'DIO rises from 40 to 55 days', 'DSO rises from 35 to 50 days', 'The cash conversion cycle lengthens'], a: 0,
        why: `Paying suppliers later keeps cash in the business longer. Higher DIO, higher DSO and a longer cycle all tie up more cash.` } },
      { t: 'case', h: 'Lehman’s Repo 105',
        b: `Balance sheets are measured at period-end, which invites window dressing. The Lehman bankruptcy examiner’s report (Valukas, 2010) found Lehman used “Repo 105” transactions to move about $50bn of assets off its balance sheet at the end of Q2 2008, lowering reported net leverage, then brought them back days later. Compare period-end balances with averages when you can.` }
    ] },

  /* ---------- 1.8 ---------- */
  { id: 'm1-l8', title: 'Cash Flow Analysis: FCFF and FCFE', minutes: 6,
    goals: ['FCFF vs FCFE and the discount rate each needs', 'The CFA formulas, and why interest is added back after tax', 'Maintenance capex and stock-based comp'],
    sources: 'CFA Program Curriculum Level II, Equity Valuation (“Free Cash Flow Valuation”); Damodaran, Investment Valuation; Koller, Goedhart & Wessels, Valuation (McKinsey & Company); SEC press release on settlements with J.P. Morgan Chase and Citigroup over Enron transactions (July 2003).',
    cards: [
      { t: 'concept', h: 'Two kinds of free cash flow',
        b: `**FCFF** (free cash flow to the firm) is cash available to all capital providers, debt and equity, after operating costs, taxes and reinvestment. Discount it at WACC to get enterprise value. **FCFE** (to equity) is what is left for shareholders after paying debt holders and adding net borrowing. Discount it at the cost of equity to get equity value. Discounting FCFE at WACC is a classic error.` },
      { t: 'concept', h: 'The formulas (CFA notation)',
        f: 'FCFF = NI + NCC + Int(1 − <i>t</i>) − FCInv − WCInv<br>FCFF = CFO + Int(1 − <i>t</i>) − FCInv<br>FCFF = EBIT(1 − <i>t</i>) + Dep − FCInv − WCInv<br>FCFE = CFO − FCInv + Net borrowing',
        b: `NCC = non-cash charges. FCInv = fixed capital investment (capex net of asset sales). WCInv = investment in working capital. Int = interest expense. With consistent inputs, all three FCFF routes give the same number.` },
      { t: 'example', h: 'From EBIT to FCFF and FCFE',
        b: `EBIT $200m, tax 25%, D&A $40m, capex $70m, operating working capital up $15m.\nNOPAT = 200 × 0.75 = $150m.\n**FCFF** = 150 + 40 − 70 − 15 = **$105m**.\nAdd interest of $20m and net new borrowing of $10m:\n**FCFE** = 105 − 20 × 0.75 + 10 = **$100m**.` },
      { t: 'check', q: { id: 'm1-l8-q1', kind: 'num',
        q: 'CFO $300m, interest expense $40m, tax rate 25%, capex $120m. What is FCFF?', a: 210, unit: '$m',
        why: `FCFF = CFO + Int(1 − t) − FCInv = 300 + 40 × 0.75 − 120 = $210m.` } },
      { t: 'check', q: { id: 'm1-l8-q2', kind: 'num',
        q: 'Same firm, with net borrowing of +$20m. What is FCFE?', a: 200, unit: '$m',
        why: `FCFE = CFO − FCInv + net borrowing = 300 − 120 + 20 = $200m. Check: FCFF − Int(1 − t) + net borrowing = 210 − 30 + 20 = $200m.` } },
      { t: 'mistake', h: 'Adding back interest in full',
        b: `Under US GAAP, CFO is already after interest. FCFF is meant to be before financing, so you add interest back, but only Int × (1 − t), because the deduction saved taxes and that saving is already in CFO. In a DCF the tax shield is captured in WACC through the after-tax cost of debt. Leaving it in FCFF as well counts it twice.` },
      { t: 'concept', h: 'Maintenance vs growth capex',
        b: `**Maintenance capex** keeps existing capacity running; **growth capex** adds capacity. Companies rarely disclose the split. A common rough proxy is maintenance capex ≈ depreciation, which breaks down under inflation (depreciation reflects old costs) or when technology changes fast. Only maintenance capex is a cost of today’s earnings, so owner-earnings investors try to estimate it.`,
        note: 'Simplification: the depreciation proxy is a rule of thumb, not an accounting standard.' },
      { t: 'concept', h: 'Stock-based comp and FCF',
        b: `SBC is added back in CFO because it is non-cash, so reported FCF flatters SBC-heavy companies. The cost shows up as dilution instead. Desks handle it one of two ways: subtract SBC from FCF, or leave it in and use a share count that includes expected future grants. Pick one. Ignoring both overstates value per share.`,
        note: 'How to treat SBC in valuation is debated. Damodaran argues it should be treated as an operating expense.' },
      { t: 'check', q: { id: 'm1-l8-q3', kind: 'mc',
        q: 'A tech company’s CFO of $1,000m includes a $250m SBC add-back; capex is $200m. What is FCF after SBC?',
        opts: ['$550m', '$800m', '$1,050m', '$1,250m'], a: 0,
        why: `FCF = 1,000 − 200 = $800m. Treating SBC as a cash-equivalent cost: 800 − 250 = $550m.` } },
      { t: 'case', h: 'Enron: operating cash flow can be engineered',
        b: `Enron reported rising earnings using mark-to-market gains on long-term contracts and deals with off-balance-sheet entities that also hid debt. It also used “prepay” transactions that were economically loans but were booked as operating cash inflows. In 2003 the SEC settled with J.P. Morgan Chase and Citigroup over their roles in those prepays. Enron filed for bankruptcy on December 2, 2001.` },
      { t: 'check', q: { id: 'm1-l8-q4', kind: 'mc',
        q: 'Which most suggests low-quality operating cash flow?',
        opts: ['CFO boosted by stretching payables and selling receivables at quarter-end', 'CFO above net income because of large D&A', 'CFO growing in line with revenue', 'CFO stable over five years'], a: 0,
        why: `Stretching payables and selling (factoring) receivables pull cash forward. These are one-off timing moves that reverse. D&A-driven CFO is normal for capital-intensive firms.` } }
    ] },

  /* ---------- 1.9 ---------- */
  { id: 'm1-l9', title: 'Quality of Earnings', minutes: 6,
    goals: ['What makes earnings high quality', 'Accruals ratio and cash conversion', 'Red flags, screening models and how a fund uses them'],
    sources: 'CFA Program Curriculum (“Financial Reporting Quality”, “Evaluating Quality of Financial Reports”); Sloan (1996), The Accounting Review; Beneish (1999), “The Detection of Earnings Manipulation,” Financial Analysts Journal; Wirecard AG ad hoc disclosures (June 2020).',
    cards: [
      { t: 'concept', h: 'Two questions',
        b: `Earnings quality asks: (1) Do reported earnings faithfully show this period’s economic performance? (2) Are they **sustainable**? High-quality earnings are backed by cash, built on conservative estimates and free of one-offs. The CFA curriculum describes a spectrum, from GAAP-compliant, useful and sustainable at the top, down through biased choices and earnings management to fictitious transactions.` },
      { t: 'concept', h: 'The accruals ratio',
        f: 'Accruals ratio<sup>CF</sup> = <span class="fr"><span>NI − (CFO + CFI)</span><span>Average NOA</span></span>',
        b: `Earnings = cash flow + accruals, and accruals are where judgment lives. High accruals relative to net operating assets (NOA) flag lower-quality earnings. Sloan (1996) found that firms with high accruals tended to have lower future earnings and lower subsequent stock returns: the “accrual anomaly.”`,
        note: 'How much of the accrual anomaly survived after publication is debated in later research.' },
      { t: 'example', h: 'Same EPS, different quality',
        b: `**Firm A:** net income $100m, CFO $130m.\n**Firm B:** net income $100m, CFO $40m; receivables up $45m and inventory up $25m.\nCash conversion (CFO ÷ NI): A = 1.3×, B = 0.4×. B’s profit is mostly unpaid invoices and unsold goods. Before trusting B’s guidance, find out why customers aren’t paying and why stock is piling up.` },
      { t: 'check', q: { id: 'm1-l9-q1', kind: 'num',
        q: 'Net income $250m; CFO $175m. What is the cash conversion ratio (CFO ÷ NI)?', a: 0.7, tol: 0.006, unit: '×',
        why: `175 / 250 = 0.70×. A mature company persistently below 1.0× deserves a working-capital and accruals review.` } },
      { t: 'check', q: { id: 'm1-l9-q2', kind: 'num',
        q: 'Net income $120m, CFO $90m, CFI −$50m, average net operating assets $800m. What is the cash-flow accruals ratio?', a: 10, unit: '%',
        why: `Accruals = NI − (CFO + CFI) = 120 − (90 − 50) = $80m. Ratio = 80 / 800 = 10%. Watch the sign: CFI is negative, so the bracket is only $40m.` } },
      { t: 'concept', h: 'Red-flag checklist',
        b: `• Revenue growth with rising DSO\n• Inventory growing faster than sales\n• Capitalizing costs that peers expense\n• Longer asset lives\n• Reserves shrinking relative to exposure\n• “Non-recurring” charges every year\n• A widening gap between non-GAAP and GAAP earnings\n• Quarter-end spikes in sales or cash\n• Auditor changes, late filings, CFO turnover\nOne flag isn’t fraud. Clusters deserve work.` },
      { t: 'check', q: { id: 'm1-l9-q3', kind: 'mc',
        q: 'Revenue +12%, receivables +40%, inventory +35%, CFO −20%. What is the best reading?',
        opts: ['Possible channel stuffing or early revenue recognition; check DSO and payment terms', 'Strong demand', 'Improving cash conversion', 'Nothing unusual'], a: 0,
        why: `Receivables and inventory are growing about three times faster than sales while cash flow falls. That pattern fits pulling sales forward or booking revenue early. It isn’t proof, but it is exactly where to dig.` } },
      { t: 'concept', h: 'The Beneish M-score',
        b: `Beneish’s (1999) M-score is a probit model built on eight ratios, including days’ sales in receivables, gross margin, asset quality, sales growth and total accruals to total assets, estimated on firms known to have manipulated earnings. A higher score means a higher estimated probability of manipulation. Use it as a screen that tells you where to dig, not as a verdict. It throws false positives, especially among fast growers.` },
      { t: 'mistake', h: 'Trusting “one-time” items',

/* ---------- persistent state (localStorage, always wrapped) ---------- */
const KEY = 'buyside-curriculum-v1';

/* ---------- XP, streak, levels ---------- */

  const t = today();

    S.streak.count = S.streak.last === yesterday() ? S.streak.count + 1 : 1;

}

}
const LEVEL_XP = 250;

/* ---------- spaced repetition (Leitner boxes) ---------- */

function srsMiss(id) { S.srs[id] = { box: 0, due: Date.now() + SRS_STEPS[0] }; }

}
const dueIds = () => { const now = Date.now(); return Object.keys(S.srs).filter(id => QIX[id] && S.srs[id].due <= now); };

/* ---------- progress ---------- */
const lessonDone = id => !!(S.lessons[id] && S.lessons[id].done);

  const total = m.lessons.length, done = m.lessons.filter(l => lessonDone(l.id)).length;

}
function ring(pct, size, stroke, label) {

/* ---------- router (plain #name hashes) ---------- */
let stack = [], replacing = false, curBase = null, curOv = null;
const curHash = () => (location.hash || '').replace(/^#/, '') || 'learn';
function onHash() {
  const h = curHash();
  if (replacing) { replacing = false; stack[stack.length - 1] = h; }
  else if (stack.length >= 2 && stack[stack.length - 2] === h) stack.pop();
  else stack.push(h);
  if (stack.length > 60) stack = stack.slice(-60);
  route();
}
function go(h) { if (curHash() === h) route(); else location.hash = h; }
function replaceTo(h) { if (curHash() === h) { route(); return; } replacing = true; location.replace('#' + h); }
function back(parent) { if (stack.length >= 2 && stack[stack.length - 2] === parent) history.back(); else replaceTo(parent); }

function route() {
  const h = curHash(); let m, base = h, ov = null;
  if ((m = h.match(/^lesson-(m\d+-l\d+)$/)) && LESSONS[m[1]]) { base = 'module-' + LESSONS[m[1]].m.id; ov = ['lesson', m[1]]; }
  else if ((m = h.match(/^quiz-(m\d+)$/)) && modById(m[1]) && ready(modById(m[1]))) { base = 'module-' + m[1]; ov = ['quiz', m[1]]; }
  else if ((m = h.match(/^formulas-(m\d+)$/)) && modById(m[1]) && modById(m[1]).formulas) { base = 'module-' + m[1]; ov = ['formulas', m[1]]; }
  else if ((m = h.match(/^tool-([A-Za-z]+)$/)) && TOOLS[m[1]]) { base = 'tools'; ov = ['tool', m[1]]; }
  else if (h === 'review-session') { base = 'review'; ov = ['review']; }
  else if (h === 'practice') { base = 'review'; ov = ['practice']; }
  const key = ov ? ov.join(':') : null;
  if (key !== curOv) closeOverlay();
  renderBase(base);
  if (ov && key !== curOv) { curOv = key; openOverlay(ov); }
}

function renderBase(base) {
  const sameBase = base === curBase, y = window.scrollY;
  let m;
  if ((m = base.match(/^module-(m\d+)$/)) && modById(m[1])) { curTab = 'learn'; viewModule(modById(m[1])); }

  else if (base === 'tools') { curTab = 'tools'; viewTools(); }

}

/* ---------- questions: multiple choice, numeric, drag-to-order ---------- */
let qn = 0;
function parseNum(s) {
  s = String(s).trim().replace(/[−–]/g, '-');
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[,\s$€£%×]/g, '').replace(/(bn|m|days?|d|x|shares?|y)$/i, '');
  if (!s || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return null;
  const v = Number(s); return isFinite(v) ? (neg ? -v : v) : null;
}
const fmtAns = q => Number(q.a).toLocaleString('en-US', { maximumFractionDigits: 4 }) + (q.unit ? ' ' + q.unit : '');
function questionEl(q, onResult) {
  const uid = 'q' + (++qn);
  const w = document.createElement('div'); w.className = 'stack';
  w.innerHTML = `<div class="qp">${md(q.q)}</div>`;
  const fb = document.createElement('div'); fb.className = 'fb'; fb.hidden = true; fb.setAttribute('role', 'status');
  const finish = (ok, extra) => {
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<span class="v">${ok ? 'Correct' : 'Not quite'}</span>${extra || ''}<div>${md(q.why)}</div>`;
    fb.hidden = false; onResult(ok);
    requestAnimationFrame(() => { try { fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { fb.scrollIntoView(); } });
  };
  if (q.kind === 'mc') {
    const order = shuffle(q.opts.map((_, i) => i));
    const box = document.createElement('div'); box.className = 'opts';
    box.innerHTML = order.map((oi, k) => `<button class="opt" type="button" data-oi="${oi}"><span class="k">${'ABCDEF'[k]}</span><span>${md(q.opts[oi])}</span></button>`).join('');
    box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || box.dataset.done) return;
      box.dataset.done = '1'; const ok = +b.dataset.oi === q.a;
      $$('.opt', box).forEach(x => { x.disabled = true; const xi = +x.dataset.oi; if (xi === q.a) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); else x.classList.add('dim'); });
      finish(ok);
    });
    w.appendChild(box);
  } else if (q.kind === 'num') {
    const f = document.createElement('form'); f.className = 'numf'; f.noValidate = true;
    f.innerHTML = `<label class="inp" for="${uid}"><input id="${uid}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Your answer" aria-label="Your answer${q.unit ? ' in ' + esc(q.unit) : ''}">${q.unit ? `<span class="u">${esc(q.unit)}</span>` : ''}</label><button class="btn primary" type="submit">Check</button>`;
    f.addEventListener('submit', e => {
      e.preventDefault(); if (f.dataset.done) return;
      const inp = f.querySelector('input'); let v = parseNum(inp.value);
      if (v == null) { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); toast('Enter a plain number'); return; }
