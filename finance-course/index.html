      const tol = q.tol != null ? q.tol : Math.max(Math.abs(q.a) * 0.01, 1e-6);
      const ok = Math.abs(v - q.a) <= tol + 1e-9;
      f.dataset.done = '1'; inp.readOnly = true; f.querySelector('button').disabled = true; f.classList.add(ok ? 'ok' : 'no'); inp.blur();
      finish(ok, ok ? '' : `<div>Answer: <b class="mono">${esc(fmtAns(q))}</b></div>`);
    });
    w.appendChild(f);
  } else if (q.kind === 'order') {
    const items = q.opts.map((t, i) => ({ t, i }));
    let sh = shuffle(items), guard = 0;
    while (sh.every((x, k) => x.i === k) && guard++ < 20) sh = shuffle(items);
    const ul = document.createElement('ol'); ul.className = 'ord'; ul.setAttribute('aria-label', 'Items to order');
    ul.innerHTML = sh.map(x => `<li data-i="${x.i}"><span class="grip">${I.grip}</span><span class="lbl">${md(x.t)}</span><span class="mv"><button type="button" data-mv="-1" aria-label="Move up">${I.up}</button><button type="button" data-mv="1" aria-label="Move down">${I.down}</button></span></li>`).join('');
    sortable(ul);
    ul.addEventListener('click', e => {
      const b = e.target.closest('[data-mv]'); if (!b || ul.classList.contains('locked')) return;
      const li = b.closest('li'), d = +b.dataset.mv;
      if (d < 0 && li.previousElementSibling) ul.insertBefore(li, li.previousElementSibling);
      else if (d > 0 && li.nextElementSibling) ul.insertBefore(li.nextElementSibling, li);
      b.focus();
    });
    const hint = document.createElement('p'); hint.className = 'sub'; hint.textContent = 'Drag items, or use the arrows.';
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn primary block'; btn.textContent = 'Check order';
    btn.addEventListener('click', () => {
      ul.classList.add('locked'); btn.hidden = true; hint.hidden = true; let ok = true;
      $$('li', ul).forEach((li, k) => { const r = +li.dataset.i === k; li.classList.add(r ? 'right' : 'wrong'); if (!r) ok = false; });
      finish(ok, ok ? '' : `<div>Correct order:</div><ol class="ord-key">${q.opts.map(o => `<li>${md(o)}</li>`).join('')}</ol>`);
    });

}
function sortable(ul) {

  ul.addEventListener('pointerdown', e => {
    if (ul.classList.contains('locked') || e.target.closest('button')) return;
    const li = e.target.closest('li'); if (!li) return;
    e.preventDefault(); d = { li, y: e.clientY, id: e.pointerId };
    try { li.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

    if (nx && dy > nx.offsetHeight / 2 + gap / 2) { ul.insertBefore(nx, li); d.y += nx.offsetHeight + gap; }
    else if (pv && dy < -(pv.offsetHeight / 2 + gap / 2)) { ul.insertBefore(li, pv); d.y -= pv.offsetHeight + gap; }
    dy = e.clientY - d.y; li.style.transform = `translateY(${dy}px)`;

  ul.addEventListener('pointerup', end); ul.addEventListener('pointercancel', end);
}

  </div>`;

}
function answered(i) { const c = P.cfg.cards[i]; if (c.t !== 'check') return true; return P.ans[i] !== undefined || !!(P.cfg.known && P.cfg.known(c.q)); }
function onAnswer(i, q, ok) { if (!P) return; if (P.ans[i] === undefined) { P.ans[i] = ok; P.cfg.onAnswer(q, ok); } updateNav(); }
function showCard(i, dir) {

  let el;

    el.innerHTML = c.t === 'intro' ? P.cfg.intro() : P.cfg.done();
  } else el = P.built[i] || (P.built[i] = buildCard(c, i));
  const stage = $('#stage'); stage.replaceChildren(el); stage.scrollTop = 0;
  el.classList.remove('in-r', 'in-l'); void el.offsetWidth;

}
function updateNav() {

  const i = P.idx, n = P.cfg.cards.length, c = P.cfg.cards[i];
  $('#plCount').textContent = (i + 1) + '/' + n;
  $$('#plProg i').forEach((seg, k) => {
    seg.className = k === i ? 'cur' : k < i ? (P.ans[k] === true ? 'ok' : P.ans[k] === false ? 'no' : 'on') : (P.ans[k] === true ? 'ok' : P.ans[k] === false ? 'no' : '');
  });
  $('#plPrev').disabled = i === 0;
  const nx = $('#plNext');

}
function next() {
  if (!P) return; const i = P.idx, c = P.cfg.cards[i];

  if (!answered(i)) { toast('Answer to continue'); return; }

}
function prev() { if (P && P.idx > 0) showCard(P.idx - 1, -1); }
function closeCurrent() { back(ovParent); }

/* ---------- lessons ---------- */
function openLesson(lid) {
  const { m, l, i } = LESSONS[lid];
  const cards = [{ t: 'intro' }, ...l.cards, { t: 'done' }];
  const nChecks = l.cards.filter(c => c.t === 'check').length;
  const sess = { xp: 0, missed: 0 };
  let start = 0;
  if (S.resume && S.resume.les === lid && S.resume.idx < cards.length - 1) start = S.resume.idx;
  const nxt = m.lessons[i + 1];
  ovClose = () => { if (S.resume && S.resume.les === lid) { S.resume.open = false; save(); } };
  player({
    title: lessonNo(m, i) + ' · ' + l.title, cards, start, parent: 'module-' + m.id,
    known: q => !!S.answered[q.id],
    onShow(idx, c) {
      S.resume = { les: lid, idx, open: true, ts: Date.now() };
      if (c.t === 'done' && !lessonDone(lid)) { S.lessons[lid] = { done: true, at: Date.now() }; sess.xp += 25; addXP(25, true); toast('Lesson complete · +25 XP'); }
      save();
    },
    onAnswer(q, ok) {
      tally(ok);
      if (S.answered[q.id] === undefined) { S.answered[q.id] = { c: ok, t: Date.now() }; if (ok) { sess.xp += 10; addXP(10); } }
      if (!ok) { srsMiss(q.id); sess.missed++; }
      save(); refreshChrome();
    },
    intro: () => `<span class="chip intro">Lesson ${lessonNo(m, i)} · ${l.minutes} min</span><h3>${esc(l.title)}</h3>
      <div><div class="eyebrow" style="margin-bottom:6px">You’ll learn</div><ul class="goals">${(l.goals || []).map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>
      <p class="sub">${l.cards.length} cards · ${nChecks} quick checks${lessonDone(lid) ? ' · completed before' : ''}</p>
      <div class="src"><b>Sources</b>${esc(l.sources)}</div>
      <p class="hint">Swipe left or tap Next</p>`,
    done: () => {
      const vals = Object.values(P.ans), right = vals.filter(Boolean).length;
      return `<span class="chip check">Lesson complete</span><h3>${esc(l.title)}</h3>
      <div class="kpis"><div class="kpi"><div class="l">Checks right</div><div class="v">${right}/${vals.length}</div></div><div class="kpi hl"><div class="l">XP this session</div><div class="v">+${sess.xp}</div></div><div class="kpi"><div class="l">Sent to review</div><div class="v">${sess.missed}</div></div></div>
      ${sess.missed ? '<p class="sub">Missed questions come back in your review queue in about 10 minutes, then at growing intervals.</p>' : ''}
      ${nxt ? `<p class="sub">Up next: <strong>${lessonNo(m, i + 1)} ${esc(nxt.title)}</strong></p>` : `<p class="sub">That was the last lesson in Module ${m.num}. The mastery quiz is next.</p>`}
      <div class="src"><b>Sources</b>${esc(l.sources)}</div>`;
    },
    doneAction: () => nxt ? { label: 'Next lesson', run: () => replaceTo('lesson-' + nxt.id) }
      : (m.quiz && m.quiz.length) ? { label: 'Take the mastery quiz', run: () => replaceTo('quiz-' + m.id) }
      : { label: 'Back to module', run: closeCurrent }
  });
}

/* ---------- mastery quiz ---------- */
function openQuiz(mid) {
  const m = modById(mid), qs = m.quiz || [];
  const cards = [{ t: 'intro' }, ...qs.map(q => ({ t: 'check', q })), { t: 'done' }];
  const res = {}; let pct = 0, recorded = false, xp = 0;
  player({
    title: 'Module ' + m.num + ' · Mastery quiz', cards, start: 0, parent: 'module-' + mid,
    onAnswer(q, ok) { res[q.id] = ok; tally(ok); if (!ok) srsMiss(q.id); save(); },
    onShow(i, c) {
      if (c.t !== 'done' || recorded) return; recorded = true;
      const r = Object.values(res).filter(Boolean).length; pct = Math.round(r / qs.length * 100);
      const prev = S.quiz[mid];
      S.quiz[mid] = { best: Math.max(prev ? prev.best : 0, pct), last: pct, attempts: (prev ? prev.attempts : 0) + 1, at: Date.now() };
      xp = r * 5 + (pct >= 80 && !(prev && prev.best >= 80) ? 50 : 0);
      addXP(xp, true); save(); toast('+' + xp + ' XP');
    },
    intro: () => { const b = S.quiz[mid]; return `<span class="chip check">Mastery quiz</span><h3>${esc(m.title)}</h3>
      <p class="body">${qs.length} questions mixing concepts and calculations. Pass mark: 80%. Every miss goes to your review queue.</p>
      ${b ? `<p class="sub">Best so far: <strong>${b.best}%</strong> · ${b.attempts} attempt${b.attempts > 1 ? 's' : ''}</p>` : ''}
      <p class="hint">Use the formula sheet afterwards, not during.</p>`; },
    done: () => {
      const missed = qs.filter(q => res[q.id] === false);
      return `<span class="chip ${pct >= 80 ? 'check' : 'mistake'}">${pct >= 80 ? 'Passed' : 'Below the 80% pass mark'}</span>
      <div style="display:flex;align-items:center;gap:16px">${ring(pct / 100, 88, 7, pct + '%')}<div><h3>${esc(m.title)}</h3><p class="sub">${qs.length - missed.length} of ${qs.length} correct · +${xp} XP</p></div></div>
      ${missed.length ? `<div class="stack"><div class="eyebrow">Review these</div>${missed.map(q => `<div class="note"><div style="color:var(--fg);margin-bottom:4px">${md(q.q)}</div>${md(q.why)}</div>`).join('')}</div>` : '<p class="body">Clean sheet.</p>'}`;
    },
    doneAction: () => ({ label: 'Back to module', run: closeCurrent })
  });
}

/* ---------- review + practice ---------- */
function srcLabel(id) { const x = QIX[id]; if (!x) return ''; return x.l ? 'From ' + lessonNo(x.m, x.m.lessons.indexOf(x.l)) + ' ' + x.l.title : 'From Module ' + x.m.num + ' mastery quiz'; }
function openReview() {
  const ids = shuffle(dueIds()).slice(0, 20);
  if (!ids.length) { replaceTo('review'); return; }
  const cards = [{ t: 'intro' }, ...ids.map(id => ({ t: 'check', q: QIX[id].q, src: srcLabel(id) })), { t: 'done' }];
  const r = { ok: 0, no: 0, retired: 0 };
  player({
    title: 'Review · ' + ids.length + ' due', cards, start: 0, parent: 'review',
    onAnswer(q, ok) { tally(ok); if (ok) { r.ok++; if (srsHit(q.id)) r.retired++; addXP(5); } else { r.no++; srsMiss(q.id); } save(); refreshChrome(); },
    intro: () => `<span class="chip check">Spaced review</span><h3>${ids.length} question${ids.length > 1 ? 's' : ''} due</h3><p class="body">These are questions you missed. A right answer pushes each one further out (1, 3, 7, then 16 days). A miss resets it to 10 minutes.</p>`,
    done: () => `<span class="chip check">Review done</span><h3>Nice work</h3><div class="kpis"><div class="kpi"><div class="l">Correct</div><div class="v">${r.ok}</div></div><div class="kpi"><div class="l">Missed</div><div class="v">${r.no}</div></div><div class="kpi hl"><div class="l">Retired</div><div class="v">${r.retired}</div></div></div>`,
    doneAction: () => ({ label: 'Done', run: closeCurrent })

}
function openPractice() {
  let pool = [];
  MODS.forEach(m => (m.lessons || []).forEach(l => { if (lessonDone(l.id)) l.cards.forEach(c => { if (c.t === 'check') pool.push(c.q.id); }); }));
  if (!pool.length) { replaceTo('review'); toast('Finish a lesson first'); return; }
  const ids = shuffle(pool).slice(0, 10);
  const cards = [{ t: 'intro' }, ...ids.map(id => ({ t: 'check', q: QIX[id].q, src: srcLabel(id) })), { t: 'done' }];
  let ok = 0;
  player({
    title: 'Mixed practice', cards, start: 0, parent: 'review',
    onAnswer(q, good) { tally(good); if (good) { ok++; addXP(2); if (S.srs[q.id]) srsHit(q.id); } else srsMiss(q.id); save(); refreshChrome(); },
    intro: () => `<span class="chip check">Mixed practice</span><h3>${ids.length} random questions</h3><p class="body">Drawn from lessons you have completed. Misses join your review queue.</p>`,
    done: () => `<span class="chip check">Practice done</span><h3>${ok} of ${ids.length} correct</h3>`,
    doneAction: () => ({ label: 'Done', run: closeCurrent })
  });
}

const GLOSS = (() => { const out = []; MODS.forEach(m => (m.glossary || []).forEach(([t, d]) => out.push({ t, d, m }))); return out.sort((a, b) => a.t.localeCompare(b.t, 'en', { sensitivity: 'base' })); })();
let glossQ = '';
function viewGlossary() {
  V().innerHTML = `<div class="stack">
    <header class="top"><div><div class="eyebrow">${GLOSS.length} terms across the course</div><h1 class="h1">Glossary</h1></div>${pills()}</header>
    <div class="search"><input id="glossQ" type="search" placeholder="Search terms and definitions" autocomplete="off" aria-label="Search glossary" value="${esc(glossQ)}"></div>
    <div id="glossList" class="gl"></div>
  </div>`;
  const inp = $('#glossQ');
  inp.addEventListener('input', () => { glossQ = inp.value; renderGloss(); });

function renderGloss() {
  const words = glossQ.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit = g => words.every(w => (g.t + ' ' + g.d).toLowerCase().includes(w));
  const hl = s => { let h = esc(s); words.forEach(w => { const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); h = h.replace(re, '<mark>$1</mark>'); }); return h; };
  const items = GLOSS.filter(hit);
  let html = '', last = '';
  items.forEach(g => {
    const L = /[a-z]/i.test(g.t[0]) ? g.t[0].toUpperCase() : '#';
    if (!words.length && L !== last) { html += `<div class="letter">${L}</div>`; last = L; }
    html += `<div class="term"><div class="tt"><span>${hl(g.t)}</span><span class="tag">M${g.m.num}</span></div><div class="dd">${hl(g.d)}</div></div>`;
  });

let chartN = 0;
function niceTicks(a, b, n) {
  if (a === b) b = a + 1;
  const raw = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), e = raw / mag;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * mag, out = [];
  for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + step * 1e-6; v += step) out.push(+(Math.round(v / step) * step).toPrecision(12));
  return out;
}
function chart(o) {
  const W = o.w || 360, H = o.h || 232, L = o.l || 54, R = o.r || 14, T = o.t || 14, B = o.b || 42;
  const [x0, x1] = o.x, [y0, y1] = o.y;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const id = 'clip' + (++chartN);
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Chart')}"><defs><clipPath id="${id}"><rect x="${L}" y="${T - 4}" width="${W - L - R}" height="${H - T - B + 4}"/></clipPath></defs>`;
  (o.yTicks || niceTicks(y0, y1, o.yn || 4)).forEach(v => { if (v < y0 - 1e-9 || v > y1 + 1e-9) return; const y = Y(v); s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 7}" y="${(y + 4).toFixed(1)}" text-anchor="end">${o.yf ? o.yf(v) : v}</text>`; });
  (o.xTicks || niceTicks(x0, x1, o.xn || 5)).forEach(v => { if (v < x0 - 1e-9 || v > x1 + 1e-9) return; s += `<text x="${X(v).toFixed(1)}" y="${H - B + 16}" text-anchor="middle">${o.xf ? o.xf(v) : v}</text>`; });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  if (o.zero && y0 < 0 && y1 > 0) s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
  (o.vl || []).forEach(v => { const x = X(v.x).toFixed(1); s += `<line class="vl" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/>`; });
  s += `<g clip-path="url(#${id})">`;
  (o.bars || []).forEach(b => { const ya = Y(Math.max(0, b.v)), yb = Y(Math.min(0, b.v)); s += `<rect class="${b.f || 'f1'}" x="${(X(b.x) - b.w / 2).toFixed(1)}" y="${ya.toFixed(1)}" width="${b.w}" height="${Math.max(1, yb - ya).toFixed(1)}" rx="3"/>`; });
  (o.series || []).forEach(se => { const d = se.pts.filter(p => isFinite(p[0]) && isFinite(p[1])).map((p, k) => (k ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(''); if (d) s += `<path class="ln ${se.c || 'c1'} ${se.cls || ''}" d="${d}"/>`; });
  s += '</g>';
  (o.pts || []).forEach(p => {
    if (!(p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1)) return;
    const cx = X(p.x), cy = Y(p.y);
    s += `<circle class="pt ${p.f || 'f1'}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r || 5.5}"/>`;
    if (p.label) { const right = p.side ? p.side === 'r' : cx < (L + W - R) / 2; s += `<text class="lab" x="${(cx + (right ? 9 : -9)).toFixed(1)}" y="${clamp(cy + (p.dy != null ? p.dy : -9), T + 8, H - B - 4).toFixed(1)}" text-anchor="${right ? 'start' : 'end'}">${esc(p.label)}</text>`; }
  });
  if (o.xl) s += `<text x="${((L + W - R) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(o.xl)}</text>`;
  if (o.yl) { const cy = ((T + H - B) / 2).toFixed(1); s += `<text x="11" y="${cy}" text-anchor="middle" transform="rotate(-90 11 ${cy})">${esc(o.yl)}</text>`; }

/* --- bond math (shared) --- */
function bondStats(c, y, n, m = 2) {
  const N = Math.max(1, Math.round(n * m)), cp = 100 * c / m, i = y / m;
  let P = 0, mac = 0, cx = 0;
  for (let k = 1; k <= N; k++) {
    const cf = cp + (k === N ? 100 : 0), df = Math.pow(1 + i, -k);
    P += cf * df; mac += (k / m) * cf * df; cx += cf * k * (k + 1) / (m * m) * Math.pow(1 + i, -k - 2);
  }
  mac /= P; return { P, mac, mod: mac / (1 + i), cx: cx / P };
}

    render(root, uid) {

      const pv = slider(uid, 'pv', 'Starting amount', { min: 1000, max: 100000, step: 1000, value: 10000, fmt: v => '$' + v.toLocaleString('en-US') }, draw);
      const r = slider(uid, 'r', 'Annual rate (APR)', { min: 0, max: 20, step: 0.25, value: 8, fmt: v => nf(v, 2) + '%' }, draw);
      const yrs = slider(uid, 'n', 'Years', { min: 1, max: 50, step: 1, value: 30, fmt: v => v + ' y' }, draw);
      const fq = picker(uid, 'm', 'Compounding', [[1, 'Annual'], [4, 'Quarterly'], [12, 'Monthly'], [365, 'Daily'], [0, 'Continuous']], 12, draw);
      ctr.append(pv, r, yrs, fq);
      function draw() {
        const P = pv.get(), k = r.get() / 100, N = yrs.get(), m = +fq.get();
        const fv = t => m ? P * Math.pow(1 + k / m, m * t) : P * Math.exp(k * t);
        const simple = t => P * (1 + k * t);
        const ear = m ? Math.pow(1 + k / m, m) - 1 : Math.exp(k) - 1;
        const pts = [], sp = []; for (let j = 0; j <= 100; j++) { const t = N * j / 100; pts.push([t, fv(t)]); sp.push([t, simple(t)]); }
        const top = fv(N) * 1.06;
        const dbl = ear > 0 ? Math.log(2) / Math.log(1 + ear) : Infinity;
        out.innerHTML = kpis([['Future value', money(fv(N)), true], ['Growth multiple', nf(fv(N) / P, 2) + '×'], ['Effective annual rate', pct(ear)], ['Interest on interest', money(fv(N) - simple(N))], ['Doubling time (exact)', isFinite(dbl) ? nf(dbl, 1) + ' y' : '—'], ['Rule of 72 estimate', k > 0 ? nf(72 / (k * 100), 1) + ' y' : '—']])
          + `<div class="chart-box">${chart({ x: [0, N], y: [0, top], series: [{ pts: sp, c: 'c2', cls: 'dash thin' }, { pts, c: 'c1' }], yf: v => money(v).replace('.00', '').replace('.0k', 'k'), xl: 'Years', label: 'Growth of the starting amount' })}${legend([['c1', 'Compound'], ['c2', 'Simple interest']])}</div>`
          + `<div class="fx">FV = PV(1 + <i>r</i>/<i>m</i>)<sup><i>mT</i></sup> &nbsp;·&nbsp; continuous: FV = PV·<i>e</i><sup><i>rT</i></sup> &nbsp;·&nbsp; EAR = (1 + <i>r</i>/<i>m</i>)<sup><i>m</i></sup> − 1</div>`;
      }
      draw();
    }
  },

  dcf: {
    title: 'DCF Sensitivity', mod: 'm4',
    blurb: 'Five-year FCFF build with a Gordon growth terminal value, and a WACC × growth grid.',
    how: 'Watch the terminal value bar: it is usually most of the value, which is why small changes in WACC or long-run growth swing the answer. The grid shows enterprise value as WACC and terminal growth move by 50 bp steps.',
    src: 'Koller, Goedhart & Wessels, Valuation (McKinsey & Company); Damodaran, Investment Valuation; CFA Program Curriculum Level II (Free Cash Flow Valuation).',
    render(root, uid) {
      const [ctr, out] = toolFrame(root);
      const f0 = slider(uid, 'f0', 'Current FCFF', { min: 10, max: 500, step: 10, value: 100, fmt: v => '$' + v + 'm' }, draw);
      const g1 = slider(uid, 'g1', 'FCFF growth, years 1–5', { min: -5, max: 25, step: 0.5, value: 8, fmt: v => nf(v, 1) + '%' }, draw);
      const w = slider(uid, 'w', 'WACC', { min: 5, max: 14, step: 0.25, value: 9, fmt: v => nf(v, 2) + '%' }, draw);
      const g = slider(uid, 'g', 'Terminal growth', { min: 0, max: 4, step: 0.25, value: 2.5, fmt: v => nf(v, 2) + '%' }, draw);
      ctr.append(f0, g1, w, g);
      const ev = (F0, G1, W, G) => { if (W - G < 0.0025) return null; let pv = 0, f = F0; for (let t = 1; t <= 5; t++) { f *= 1 + G1; pv += f / Math.pow(1 + W, t); } const tv = f * (1 + G) / (W - G); return { pv, tv, pvtv: tv / Math.pow(1 + W, 5), ev: pv + tv / Math.pow(1 + W, 5), f5: f }; };
      function draw() {
        const F0 = f0.get(), G1 = g1.get() / 100, W = w.get() / 100, G = g.get() / 100, r = ev(F0, G1, W, G);
        if (!r) { out.innerHTML = '<div class="note"><b>Undefined</b>WACC must exceed terminal growth.</div>'; return; }
        const bars = []; let f = F0; for (let t = 1; t <= 5; t++) { f *= 1 + G1; bars.push({ x: t, v: f / Math.pow(1 + W, t), f: 'f2', w: 30 }); }
        bars.push({ x: 6.4, v: r.pvtv, f: 'f1', w: 40 });
        const top = Math.max(r.pvtv, ...bars.map(b => b.v)) * 1.12;
        const dw = [-1, -0.5, 0, 0.5, 1], dg = [-1, -0.5, 0, 0.5, 1];
        const grid = `<div class="sens"><table><thead><tr><th>WACC ↓ g →</th>${dg.map(d => `<th>${nf(G * 100 + d, 2)}%</th>`).join('')}</tr></thead><tbody>${dw.map(a => `<tr><th>${nf(W * 100 + a, 2)}%</th>${dg.map(b => { const gg = G + b / 100; if (gg < -0.02) return '<td>—</td>'; const x = ev(F0, G1, W + a / 100, gg); if (!x) return '<td>n/m</td>'; const d = x.ev / r.ev - 1, k = Math.min(55, Math.abs(d) * 160); return `<td class="${a === 0 && b === 0 ? 'base' : ''}" style="background:color-mix(in srgb, var(${d >= 0 ? '--good' : '--bad'}) ${k.toFixed(0)}%, transparent)">${Math.round(x.ev).toLocaleString('en-US')}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
        out.innerHTML = kpis([['Enterprise value', '$' + Math.round(r.ev).toLocaleString('en-US') + 'm', true], ['PV of years 1–5', '$' + Math.round(r.pv).toLocaleString('en-US') + 'm'], ['PV of terminal value', '$' + Math.round(r.pvtv).toLocaleString('en-US') + 'm'], ['Terminal value share', pct(r.pvtv / r.ev, 0), true], ['TV ÷ year-5 FCFF', nf(r.tv / r.f5, 1) + '×']])
          + `<div class="chart-box">${chart({ x: [0.3, 7], y: [0, top], bars, xTicks: [1, 2, 3, 4, 5, 6.4], xf: v => v > 6 ? 'TV' : 'Y' + v, yf: v => '$' + Math.round(v), label: 'Present value by year and terminal value' })}${legend([['c2', 'PV of yearly FCFF'], ['c1', 'PV of terminal value']])}</div>`
          + `<div class="eyebrow">Enterprise value, $m</div>${grid}`
          + `<p class="tool-note">End-of-year discounting; TV = FCFF<sub>5</sub>(1 + g) / (WACC − g). The mid-year convention would raise EV by roughly a factor of (1 + WACC)<sup>0.5</sup>. Illustrative inputs, not a company.</p>`;
      }
      draw();
    }
  },

  bondPrice: {
    title: 'Bond Price vs Yield', mod: 'm5',
    blurb: 'The price-yield curve, its duration tangent and the convexity gap between them.',
    how: 'The straight line is the duration approximation at today’s yield. For an option-free bond the curve always sits above it: that gap is convexity, and it grows with the size of the yield move.',
    src: 'Fabozzi, Bond Markets, Analysis, and Strategies; CFA Program Curriculum Level I, Fixed Income.',
    render(root, uid) {
      const [ctr, out] = toolFrame(root);
      const c = slider(uid, 'c', 'Annual coupon (paid semiannually)', { min: 0, max: 12, step: 0.25, value: 5, fmt: v => nf(v, 2) + '%' }, draw);
      const n = slider(uid, 'n', 'Years to maturity', { min: 1, max: 30, step: 1, value: 10, fmt: v => v + ' y' }, draw);
      const y = slider(uid, 'y', 'Yield to maturity', { min: 0.5, max: 15, step: 0.05, value: 6, fmt: v => nf(v, 2) + '%' }, draw);
      ctr.append(c, n, y);
      function draw() {
        const C = c.get() / 100, N = n.get(), Y0 = y.get() / 100, s = bondStats(C, Y0, N);
        const curve = []; for (let v = 0.5; v <= 15.0001; v += 0.1) curve.push([v, bondPx(C, v / 100, N)]);
        const tan = [[Y0 * 100 - 6, s.P * (1 + s.mod * 0.06)], [Y0 * 100 + 6, s.P * (1 - s.mod * 0.06)]];
        const lo = Math.min(...curve.map(p => p[1])), hi = Math.max(...curve.map(p => p[1]));
        const status = s.P > 100.005 ? 'Premium' : s.P < 99.995 ? 'Discount' : 'Par';
        out.innerHTML = kpis([['Price (per 100 face)', nf(s.P, 3), true], ['Trades at', status], ['Macaulay duration', nf(s.mac, 2) + ' y'], ['Modified duration', nf(s.mod, 2)], ['Convexity', nf(s.cx, 1)], ['DV01 per $1m face', '$' + Math.round(s.mod * s.P).toLocaleString('en-US'), true]])
          + `<div class="chart-box">${chart({ x: [0.5, 15], y: [Math.max(0, lo * 0.92), hi * 1.04], series: [{ pts: tan, c: 'c2', cls: 'dash thin' }, { pts: curve, c: 'c1' }], pts: [{ x: Y0 * 100, y: s.P, label: nf(s.P, 2) }], vl: [{ x: Y0 * 100 }], xf: v => v + '%', yf: v => Math.round(v), xl: 'Yield to maturity', label: 'Bond price against yield' })}${legend([['c1', 'Actual price'], ['c2', 'Duration tangent']])}</div>`
          + `<p class="tool-note">Face value 100, semiannual coupons, bond-equivalent yield, priced on a coupon date (no accrued interest). DV01 = modified duration × price × 0.0001 per 100 face.</p>`;
      }
      draw();
    }
  },

  duration: {
    title: 'Duration vs Actual Price Change', mod: 'm5',
    blurb: 'Compare the duration estimate, duration plus convexity, and full repricing for a yield shock.',
    how: 'For small shocks all three agree. As the shock grows, duration alone overstates losses when yields rise and understates gains when they fall. Adding the convexity term closes most of the gap.',
    src: 'Fabozzi, Bond Markets, Analysis, and Strategies; CFA Program Curriculum Level I, Fixed Income (yield-based bond duration and convexity).',
    render(root, uid) {
      const [ctr, out] = toolFrame(root);
      const c = slider(uid, 'c', 'Annual coupon', { min: 0, max: 12, step: 0.25, value: 4, fmt: v => nf(v, 2) + '%' }, draw);
      const n = slider(uid, 'n', 'Years to maturity', { min: 1, max: 30, step: 1, value: 20, fmt: v => v + ' y' }, draw);
      const y = slider(uid, 'y', 'Starting yield', { min: 0.5, max: 12, step: 0.05, value: 4.5, fmt: v => nf(v, 2) + '%' }, draw);
      const sh = slider(uid, 'sh', 'Yield shock', { min: -300, max: 300, step: 25, value: 100, fmt: v => (v > 0 ? '+' : '') + v + ' bp' }, draw);
      ctr.append(c, n, y, sh);
      function draw() {
        const C = c.get() / 100, N = n.get(), Y0 = y.get() / 100, s = bondStats(C, Y0, N), d = sh.get() / 1e4;
        const act = dd => (bondPx(C, Y0 + dd, N) / s.P - 1) * 100, du = dd => -s.mod * dd * 100, dc = dd => (-s.mod * dd + 0.5 * s.cx * dd * dd) * 100;
        const A = [], D = [], DC = []; for (let b = -300; b <= 300; b += 10) { const dd = b / 1e4; A.push([b, act(dd)]); D.push([b, du(dd)]); DC.push([b, dc(dd)]); }
        const all = [...A, ...D, ...DC].map(p => p[1]), lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * 0.08;
        out.innerHTML = kpis([['Actual price change', nf(act(d), 2) + '%', true], ['Duration estimate', nf(du(d), 2) + '%'], ['Duration + convexity', nf(dc(d), 2) + '%'], ['Duration-only error', nf(du(d) - act(d), 2) + ' pp'], ['Modified duration', nf(s.mod, 2)], ['Convexity', nf(s.cx, 1)]])
          + `<div class="chart-box">${chart({ x: [-300, 300], y: [lo - pad, hi + pad], zero: true, series: [{ pts: D, c: 'c2', cls: 'dash thin' }, { pts: DC, c: 'c3', cls: 'dot' }, { pts: A, c: 'c1' }], pts: [{ x: sh.get(), y: act(d) }], vl: [{ x: sh.get() }], xTicks: [-300, -150, 0, 150, 300], xf: v => (v > 0 ? '+' : '') + v, yf: v => nf(v, 0) + '%', xl: 'Yield shock (bp)', label: 'Percentage price change against yield shock' })}${legend([['c1', 'Actual'], ['c2', 'Duration only'], ['c3', 'Duration + convexity']])}</div>`
          + `<div class="fx">%ΔP ≈ −D<sub>mod</sub>·Δ<i>y</i> + ½·C·(Δ<i>y</i>)<sup>2</sup></div>`;
      }
      draw();
    }
  },

  frontier: {
    title: 'Two-Asset Efficient Frontier', mod: 'm6',
    blurb: 'Change the correlation and watch diversification bend the risk-return curve.',
    how: 'At correlation +1 the portfolios lie on a straight line between the assets: no diversification benefit. Lower correlation bows the curve to the left. At −1 a zero-risk mix exists. The bold segment above the minimum-variance point is the efficient frontier.',
    src: 'Bodie, Kane & Marcus, Investments (Optimal Risky Portfolios); Markowitz (1952); CFA Program Curriculum Level I, Portfolio Management.',
    render(root, uid) {
      const [ctr, out] = toolFrame(root);
      const ma = slider(uid, 'ma', 'Asset A expected return', { min: 1, max: 20, step: 0.5, value: 6, fmt: v => nf(v, 1) + '%' }, draw);
      const sa = slider(uid, 'sa', 'Asset A volatility', { min: 2, max: 40, step: 1, value: 12, fmt: v => v + '%' }, draw);
      const mb = slider(uid, 'mb', 'Asset B expected return', { min: 1, max: 20, step: 0.5, value: 12, fmt: v => nf(v, 1) + '%' }, draw);
      const sb = slider(uid, 'sb', 'Asset B volatility', { min: 2, max: 40, step: 1, value: 25, fmt: v => v + '%' }, draw);
      const rh = slider(uid, 'rho', 'Correlation ρ', { min: -1, max: 1, step: 0.05, value: 0.3, fmt: v => nf(v, 2) }, draw);
      ctr.append(ma, sa, mb, sb, rh);
      function draw() {
        const mA = ma.get(), sA = sa.get(), mB = mb.get(), sB = sb.get(), r = rh.get();
        const sd = w => Math.sqrt(Math.max(0, w * w * sA * sA + (1 - w) * (1 - w) * sB * sB + 2 * w * (1 - w) * r * sA * sB)), mu = w => w * mA + (1 - w) * mB;
        const den = sA * sA + sB * sB - 2 * r * sA * sB;
        const wStar = den > 1e-12 ? clamp((sB * sB - r * sA * sB) / den, 0, 1) : (sA <= sB ? 1 : 0);
        const curve = [], eff = []; for (let j = 0; j <= 200; j++) { const w = j / 200; curve.push([sd(w), mu(w)]); }
        const higherIsA = mA >= mB;
        for (let j = 0; j <= 200; j++) { const w = j / 200; if (higherIsA ? w >= wStar : w <= wStar) eff.push([sd(w), mu(w)]); }
        eff.sort((a, b) => a[1] - b[1]);
        const xmax = Math.max(sA, sB) * 1.15, ylo = Math.max(0, Math.min(mA, mB) - 2), yhi = Math.max(mA, mB) + 2;
        const avg = wStar * sA + (1 - wStar) * sB;
        out.innerHTML = kpis([['Min-variance weight in A', pct(wStar, 0), true], ['Min-variance volatility', nf(sd(wStar), 2) + '%', true], ['Min-variance return', nf(mu(wStar), 2) + '%'], ['Weighted-avg volatility', nf(avg, 2) + '%'], ['Diversification benefit', nf(avg - sd(wStar), 2) + ' pp']])
          + `<div class="chart-box">${chart({ x: [0, xmax], y: [ylo, yhi], series: [{ pts: [[sB, mB], [sA, mA]], c: 'c5', cls: 'dash thin' }, { pts: curve, c: 'c2', cls: 'thin' }, { pts: eff, c: 'c1' }], pts: [{ x: sA, y: mA, f: 'f2', label: 'A' }, { x: sB, y: mB, f: 'f2', label: 'B' }, { x: sd(wStar), y: mu(wStar), f: 'f1', label: 'Min variance', side: 'r', dy: 16 }], xf: v => v + '%', yf: v => nf(v, 0) + '%', xl: 'Volatility (σ)', yl: 'Expected return', label: 'Two-asset efficient frontier' })}${legend([['c1', 'Efficient frontier'], ['c2', 'Inefficient part'], ['c5', 'ρ = +1 line']])}</div>`
          + `<div class="fx">σ<sub><i>p</i></sub><sup>2</sup> = <i>w</i><sup>2</sup>σ<sub>A</sub><sup>2</sup> + (1 − <i>w</i>)<sup>2</sup>σ<sub>B</sub><sup>2</sup> + 2<i>w</i>(1 − <i>w</i>)ρσ<sub>A</sub>σ<sub>B</sub></div>`
          + `<p class="tool-note">Long-only weights (0–100%). Inputs are illustrative expectations, not forecasts.</p>`;
      }
      draw();
    }
  },

  options: {
    title: 'Option Payoff Diagram', mod: 'm7',
    blurb: 'Payoff and profit at expiry for calls, puts and a straddle, with breakevens.',
    how: 'The dashed line is the payoff at expiry; the solid line subtracts (or adds) the premium to give profit. Long options cap your loss at the premium; short options cap your gain at the premium.',
    src: 'Hull, Options, Futures, and Other Derivatives (Trading Strategies Involving Options); CFA Program Curriculum Level I, Derivatives.',
    render(root, uid) {
      const [ctr, out] = toolFrame(root);
      const STR = {
        lc: ['Long call', (S, K) => Math.max(S - K, 0), 1], sc: ['Short call', (S, K) => -Math.max(S - K, 0), -1],
        lp: ['Long put', (S, K) => Math.max(K - S, 0), 1], sp: ['Short put', (S, K) => -Math.max(K - S, 0), -1],
        ls: ['Long straddle (call + put)', (S, K) => Math.abs(S - K), 1]
      };
      const st = picker(uid, 'st', 'Position', Object.entries(STR).map(([k, v]) => [k, v[0]]), 'lc', draw);
      const k = slider(uid, 'k', 'Strike K', { min: 60, max: 140, step: 1, value: 100, fmt: v => '$' + v }, draw);
      const pr = slider(uid, 'pr', 'Premium (total for the straddle)', { min: 0.5, max: 30, step: 0.5, value: 6, fmt: v => '$' + nf(v, 2) }, draw);
      ctr.append(st, k, pr);
      function draw() {
        const key = st.get(), [, pay, sign] = STR[key], K = k.get(), p = pr.get();
        const pl = S => pay(S, K) - sign * p;
        const P1 = [], P2 = []; for (let S = 30; S <= 170; S += 1) { P1.push([S, pay(S, K)]); P2.push([S, pl(S)]); }
        const all = [...P1, ...P2].map(x => x[1]), lo = Math.min(...all), hi = Math.max(...all), pad = Math.max(4, (hi - lo) * 0.08);
        let maxP, maxL, be;
        if (key === 'lc') { maxP = 'Unlimited'; maxL = '$' + nf(p, 2); be = [K + p]; }
        if (key === 'sc') { maxP = '$' + nf(p, 2); maxL = 'Unlimited'; be = [K + p]; }
        if (key === 'lp') { maxP = '$' + nf(K - p, 2) + ' (S → 0)'; maxL = '$' + nf(p, 2); be = [K - p]; }
        if (key === 'sp') { maxP = '$' + nf(p, 2); maxL = '$' + nf(K - p, 2) + ' (S → 0)'; be = [K - p]; }
        if (key === 'ls') { maxP = 'Unlimited'; maxL = '$' + nf(p, 2); be = [K - p, K + p]; }
        out.innerHTML = kpis([['Max profit', maxP], ['Max loss', maxL], ['Breakeven' + (be.length > 1 ? 's' : ''), be.map(b => '$' + nf(b, 2)).join(' / '), true]])
          + `<div class="chart-box">${chart({ x: [30, 170], y: [lo - pad, hi + pad], zero: true, series: [{ pts: P1, c: 'c2', cls: 'dash thin' }, { pts: P2, c: 'c1' }], pts: be.map(b => ({ x: b, y: 0, f: 'f1', label: 'BE ' + nf(b, 1), dy: -10 })), vl: [{ x: K }], xTicks: [40, 70, 100, 130, 160], xf: v => '$' + v, yf: v => nf(v, 0), xl: 'Stock price at expiry (S)', yl: 'Per share', label: 'Option payoff and profit at expiry' })}${legend([['c1', 'Profit at expiry'], ['c2', 'Payoff at expiry']])}</div>`
          + `<p class="tool-note">Per share, at expiry. Ignores the interest cost of the premium, early exercise and transaction costs. The vertical line marks the strike.</p>`;
      }
      draw();
    }
  }
};

applyTheme();

if ((!h0 || h0 === 'learn') && S.resume && S.resume.open && LESSONS[S.resume.les]) {

} else route();
})();
